<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#020617" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Klassen-Board</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#3b82f6"
          }
        }
      }
    };
  </script>

  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");

    * {
      box-sizing: border-box;
    }

    body {
      font-family: "Inter", system-ui, sans-serif;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .nav-btn.active {
      background: #2563eb;
      color: white;
    }

    input,
    select,
    textarea {
      color-scheme: dark;
    }

    .glass {
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .fab-menu {
      transform: scale(0.85) translateY(15px);
      opacity: 0;
      pointer-events: none;
      transition: 0.2s ease;
    }

    .fab-menu.open {
      transform: scale(1) translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    .fab {
      transition: transform 0.2s ease;
    }

    .fab.open {
      transform: rotate(45deg);
    }

    .modal {
      opacity: 0;
      pointer-events: none;
      transition: 0.2s ease;
    }

    .modal.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      transform: translateY(20px) scale(0.97);
      transition: 0.2s ease;
    }

    .modal.open .modal-card {
      transform: translateY(0) scale(1);
    }
  </style>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen pb-24">

  <!-- HEADER -->
  <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-xl border-b border-slate-800 px-4 py-3 flex items-center justify-between">

    <div>
      <h1 id="classNameDisplay" class="text-lg font-bold">
        Klassen-Board
      </h1>

      <p id="dateDisplay" class="text-xs text-slate-400"></p>
    </div>

    <button
      onclick="toggleAdmin()"
      id="adminBtn"
      class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-full transition"
    >
      Einstellungen
    </button>
  </header>


  <!-- MAIN -->
  <main class="px-4 pt-4 max-w-lg mx-auto">


    <!-- DASHBOARD -->
    <section id="tab-dashboard" class="tab-content active space-y-4">

      <div class="bg-gradient-to-br from-blue-600 to-indigo-700 rounded-2xl p-5 shadow-lg">

        <p class="text-blue-100 text-sm mb-1">
          Willkommen zurück
        </p>

        <h2 id="greeting" class="text-2xl font-bold">
          Hey!
        </h2>

        <p id="todaySummary" class="text-blue-100 text-sm mt-2">
          Lade...
        </p>

      </div>


      <!-- QUICK STATS -->
      <div class="grid grid-cols-2 gap-3">

        <div class="bg-slate-900 rounded-xl p-4 border border-slate-800">
          <p class="text-slate-400 text-xs">
            Nächster Termin
          </p>

          <p id="nextExam" class="font-semibold mt-1 text-sm">
            Keine
          </p>
        </div>

        <div class="bg-slate-900 rounded-xl p-4 border border-slate-800">
          <p class="text-slate-400 text-xs">
            Offene Hausaufgaben
          </p>

          <p id="openHomework" class="font-semibold mt-1 text-sm">
            0
          </p>
        </div>

      </div>


      <!-- HEUTE -->
      <div class="bg-slate-900 rounded-xl p-4 border border-slate-800">

        <div class="flex items-center justify-between mb-3">
          <h3 class="font-semibold">
            Heute
          </h3>

          <button
            onclick="showTab('schedule')"
            class="text-xs text-blue-400"
          >
            Alle →
          </button>
        </div>

        <div
          id="todaySchedule"
          class="space-y-2 text-sm"
        ></div>

      </div>


      <!-- ANKÜNDIGUNGEN -->
      <div class="bg-slate-900 rounded-xl p-4 border border-slate-800">

        <h3 class="font-semibold mb-3">
          Ankündigungen
        </h3>

        <div
          id="announcementsList"
          class="space-y-3 text-sm"
        ></div>

      </div>

    </section>



    <!-- NOTEN -->
    <section id="tab-grades" class="tab-content space-y-4">

      <div class="flex items-center justify-between">

        <h2 class="text-xl font-bold">
          Noten
        </h2>

        <span
          id="overallAverage"
          class="text-sm text-slate-400"
        >
          Ø –
        </span>

      </div>

      <div
        id="gradesList"
        class="space-y-3"
      ></div>

    </section>



    <!-- HAUSAUFGABEN -->
    <section id="tab-homework" class="tab-content space-y-4">

      <div class="flex items-center justify-between">

        <h2 class="text-xl font-bold">
          Hausaufgaben
        </h2>

        <button
          onclick="toggleCompletedHomework()"
          id="toggleHwBtn"
          class="text-xs text-slate-400"
        >
          Erledigte anzeigen
        </button>

      </div>

      <div
        id="homeworkList"
        class="space-y-3"
      ></div>

    </section>



    <!-- STUNDENPLAN -->
    <section id="tab-schedule" class="tab-content space-y-4">

      <div class="flex items-center justify-between">

        <h2 class="text-xl font-bold">
          Stundenplan
        </h2>

        <span class="text-xs text-slate-500">
          Unterricht & Pausen
        </span>

      </div>


      <!-- TAGE -->
      <div
        id="daySelector"
        class="flex gap-2 overflow-x-auto pb-2"
      ></div>


      <!-- STUNDEN -->
      <div
        id="scheduleList"
        class="space-y-2"
      ></div>

    </section>



    <!-- TERMINE -->
    <section id="tab-events" class="tab-content space-y-4">

      <h2 class="text-xl font-bold">
        Termine
      </h2>

      <div
        id="eventsList"
        class="space-y-3"
      ></div>

    </section>



    <!-- ABSENZEN -->
    <section id="tab-absences" class="tab-content space-y-4">

      <h2 class="text-xl font-bold">
        Absenzen
      </h2>

      <div
        id="absencesList"
        class="space-y-3"
      ></div>

    </section>



    <!-- EINSTELLUNGEN -->
    <section id="tab-admin" class="tab-content space-y-6">

      <h2 class="text-xl font-bold">
        Einstellungen
      </h2>


      <!-- NAME -->
      <div class="bg-slate-900 rounded-xl p-4 border border-slate-800 space-y-3">

        <div>
          <h3 class="font-semibold text-sm text-slate-300">
            Dein Name
          </h3>

          <p class="text-xs text-slate-500 mt-1">
            Wird nur auf diesem Gerät gespeichert.
          </p>
        </div>

        <input
          id="inputUserName"
          type="text"
          maxlength="30"
          placeholder="z. B. Finn"
          class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm outline-none focus:border-blue-500"
        />

        <button
          onclick="saveUserName()"
          class="w-full bg-blue-600 hover:bg-blue-500 py-2 rounded-lg text-sm font-medium"
        >
          Namen speichern
        </button>

      </div>


      <!-- KLASSE -->
      <div class="bg-slate-900 rounded-xl p-4 border border-slate-800 space-y-3">

        <h3 class="font-semibold text-sm text-slate-300">
          Klasse
        </h3>

        <input
          id="inputClassName"
          type="text"
          placeholder="z. B. 9b"
          maxlength="30"
          class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm outline-none focus:border-blue-500"
        />

        <button
          onclick="saveClassName()"
          class="w-full bg-blue-600 hover:bg-blue-500 py-2 rounded-lg text-sm font-medium"
        >
          Klasse speichern
        </button>

      </div>


      <!-- DATEN -->
      <div class="bg-slate-900 rounded-xl p-4 border border-slate-800 space-y-3">

        <h3 class="font-semibold text-sm text-slate-300">
          Daten
        </h3>

        <button
          onclick="exportData()"
          class="w-full bg-slate-800 hover:bg-slate-700 py-2 rounded-lg text-sm"
        >
          Daten exportieren
        </button>

        <button
          onclick="importData()"
          class="w-full bg-slate-800 hover:bg-slate-700 py-2 rounded-lg text-sm"
        >
          Daten importieren
        </button>

        <button
          onclick="clearAllData()"
          class="w-full bg-red-900/50 hover:bg-red-900 py-2 rounded-lg text-sm text-red-300"
        >
          Alle Daten löschen
        </button>

      </div>

    </section>

  </main>



  <!-- BOTTOM NAVIGATION -->
  <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-xl border-t border-slate-800 px-2 py-2 z-50">

    <div class="max-w-lg mx-auto flex justify-around">

      <button
        onclick="showTab('dashboard')"
        class="nav-btn active flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-xl text-xs transition"
        data-tab="dashboard"
      >
        <span class="text-lg">⌂</span>
        Home
      </button>

      <button
        onclick="showTab('grades')"
        class="nav-btn flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-xl text-xs transition"
        data-tab="grades"
      >
        <span class="text-lg">▤</span>
        Noten
      </button>

      <button
        onclick="showTab('homework')"
        class="nav-btn flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-xl text-xs transition"
        data-tab="homework"
      >
        <span class="text-lg">✓</span>
        Aufgaben
      </button>

      <button
        onclick="showTab('schedule')"
        class="nav-btn flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-xl text-xs transition"
        data-tab="schedule"
      >
        <span class="text-lg">▣</span>
        Plan
      </button>

      <button
        onclick="showTab('events')"
        class="nav-btn flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-xl text-xs transition"
        data-tab="events"
      >
        <span class="text-lg">◷</span>
        Termine
      </button>

    </div>

  </nav>



  <!-- FAB MENU -->
  <div
    id="fabMenu"
    class="fab-menu fixed bottom-24 right-5 z-50 flex flex-col items-end gap-2"
  >

    <button
      onclick="openAddModal('grade')"
      class="bg-slate-800 hover:bg-slate-700 shadow-lg px-4 py-2.5 rounded-full text-sm"
    >
      📝 Note
    </button>

    <button
      onclick="openAddModal('homework')"
      class="bg-slate-800 hover:bg-slate-700 shadow-lg px-4 py-2.5 rounded-full text-sm"
    >
      📚 Hausaufgabe
    </button>

    <button
      onclick="openAddModal('schedule')"
      class="bg-slate-800 hover:bg-slate-700 shadow-lg px-4 py-2.5 rounded-full text-sm"
    >
      🕐 Stundenplan
    </button>

    <button
      onclick="openAddModal('break')"
      class="bg-slate-800 hover:bg-slate-700 shadow-lg px-4 py-2.5 rounded-full text-sm"
    >
      ☕ Pause
    </button>

    <button
      onclick="openAddModal('event')"
      class="bg-slate-800 hover:bg-slate-700 shadow-lg px-4 py-2.5 rounded-full text-sm"
    >
      📅 Termin
    </button>

    <button
      onclick="openAddModal('announcement')"
      class="bg-slate-800 hover:bg-slate-700 shadow-lg px-4 py-2.5 rounded-full text-sm"
    >
      📢 Ankündigung
    </button>

    <button
      onclick="openAddModal('absence')"
      class="bg-slate-800 hover:bg-slate-700 shadow-lg px-4 py-2.5 rounded-full text-sm"
    >
      👤 Absenz
    </button>

  </div>


  <!-- PLUS BUTTON -->
  <button
    id="fab"
    onclick="toggleFab()"
    class="fab fixed right-5 bottom-24 z-[60] w-14 h-14 rounded-full bg-blue-600 hover:bg-blue-500 shadow-xl shadow-blue-900/30 flex items-center justify-center text-3xl font-light"
  >
    +
  </button>



  <!-- ADD MODAL -->
  <div
    id="addModal"
    class="modal fixed inset-0 z-[100] bg-black/70 backdrop-blur-sm flex items-end sm:items-center justify-center p-4"
    onclick="closeModalOutside(event)"
  >

    <div
      class="modal-card w-full max-w-lg bg-slate-900 border border-slate-800 rounded-2xl p-5 max-h-[90vh] overflow-y-auto"
    >

      <div class="flex items-center justify-between mb-5">

        <h2
          id="modalTitle"
          class="text-xl font-bold"
        >
          Hinzufügen
        </h2>

        <button
          onclick="closeAddModal()"
          class="text-slate-400 hover:text-white text-xl"
        >
          ×
        </button>

      </div>


      <!-- GRADE FORM -->
      <div id="form-grade" class="modal-form space-y-3 hidden">

        <input
          id="gradeSubject"
          type="text"
          placeholder="Fach"
          class="input"
        />

        <input
          id="gradeValue"
          type="text"
          placeholder="Note z. B. 2+"
          class="input"
        />

        <div class="grid grid-cols-2 gap-2">

          <input
            id="gradeWeight"
            type="number"
            min="0.1"
            step="0.1"
            value="1"
            placeholder="Gewichtung"
            class="input"
          />

          <input
            id="gradeDate"
            type="date"
            class="input"
          />

        </div>

        <input
          id="gradeType"
          type="text"
          placeholder="Art z. B. Klausur, mündlich"
          class="input"
        />

        <button
          onclick="addGrade()"
          class="save-btn"
        >
          Note speichern
        </button>

      </div>



      <!-- HOMEWORK FORM -->
      <div id="form-homework" class="modal-form space-y-3 hidden">

        <input
          id="hwSubject"
          type="text"
          placeholder="Fach"
          class="input"
        />

        <textarea
          id="hwTask"
          rows="3"
          placeholder="Aufgabe"
          class="input"
        ></textarea>

        <input
          id="hwDue"
          type="date"
          class="input"
        />

        <button
          onclick="addHomework()"
          class="save-btn"
        >
          Hausaufgabe speichern
        </button>

      </div>



      <!-- SCHEDULE FORM -->
      <div id="form-schedule" class="modal-form space-y-3 hidden">

        <select
          id="schedDay"
          class="input"
        >
          <option value="0">Montag</option>
          <option value="1">Dienstag</option>
          <option value="2">Mittwoch</option>
          <option value="3">Donnerstag</option>
          <option value="4">Freitag</option>
        </select>

        <input
          id="schedPeriod"
          type="number"
          min="1"
          max="15"
          placeholder="Stunde, z. B. 1"
          class="input"
        />

        <input
          id="schedSubject"
          type="text"
          placeholder="Fach"
          class="input"
        />

        <input
          id="schedRoom"
          type="text"
          placeholder="Raum (optional)"
          class="input"
        />

        <div>
          <label class="text-xs text-slate-400">
            Beginn
          </label>

          <input
            id="schedFrom"
            type="time"
            class="input mt-1"
          />
        </div>

        <div>
          <label class="text-xs text-slate-400">
            Ende
          </label>

          <input
            id="schedTo"
            type="time"
            class="input mt-1"
          />
        </div>

        <button
          onclick="addSchedule()"
          class="save-btn"
        >
          Stunde speichern
        </button>

      </div>



      <!-- BREAK FORM -->
      <div id="form-break" class="modal-form space-y-3 hidden">

        <select
          id="breakDay"
          class="input"
        >
          <option value="0">Montag</option>
          <option value="1">Dienstag</option>
          <option value="2">Mittwoch</option>
          <option value="3">Donnerstag</option>
          <option value="4">Freitag</option>
        </select>

        <input
          id="breakName"
          type="text"
          placeholder="z. B. Große Pause"
          class="input"
        />

        <div>
          <label class="text-xs text-slate-400">
            Von
          </label>

          <input
            id="breakFrom"
            type="time"
            class="input mt-1"
          />
        </div>

        <div>
          <label class="text-xs text-slate-400">
            Bis
          </label>

          <input
            id="breakTo"
            type="time"
            class="input mt-1"
          />
        </div>

        <button
          onclick="addBreak()"
          class="save-btn"
        >
          Pause speichern
        </button>

      </div>



      <!-- EVENT FORM -->
      <div id="form-event" class="modal-form space-y-3 hidden">

        <input
          id="eventTitle"
          type="text"
          placeholder="Titel z. B. Mathe Klausur"
          class="input"
        />

        <input
          id="eventDate"
          type="date"
          class="input"
        />

        <input
          id="eventType"
          type="text"
          placeholder="Typ z. B. Klausur, Ausflug"
          class="input"
        />

        <button
          onclick="addEvent()"
          class="save-btn"
        >
          Termin speichern
        </button>

      </div>



      <!-- ANNOUNCEMENT FORM -->
      <div id="form-announcement" class="modal-form space-y-3 hidden">

        <textarea
          id="annText"
          rows="4"
          placeholder="Ankündigung"
          class="input"
        ></textarea>

        <button
          onclick="addAnnouncement()"
          class="save-btn"
        >
          Ankündigung speichern
        </button>

      </div>



      <!-- ABSENCE FORM -->
      <div id="form-absence" class="modal-form space-y-3 hidden">

        <input
          id="absName"
          type="text"
          placeholder="Name"
          class="input"
        />

        <input
          id="absDate"
          type="date"
          class="input"
        />

        <input
          id="absReason"
          type="text"
          placeholder="Grund"
          class="input"
        />

        <button
          onclick="addAbsence()"
          class="save-btn"
        >
          Absenz speichern
        </button>

      </div>

    </div>

  </div>



<script>

  /* =========================================
     STYLING FÜR INPUTS
  ========================================= */

  document.querySelectorAll(".input").forEach(el => {
    el.classList.add(
      "w-full",
      "bg-slate-800",
      "border",
      "border-slate-700",
      "rounded-lg",
      "px-3",
      "py-2.5",
      "text-sm",
      "outline-none",
      "focus:border-blue-500"
    );
  });


  document.querySelectorAll(".save-btn").forEach(el => {
    el.classList.add(
      "w-full",
      "bg-blue-600",
      "hover:bg-blue-500",
      "py-2.5",
      "rounded-lg",
      "text-sm",
      "font-medium"
    );
  });



  /* =========================================
     DATEN
  ========================================= */

  const defaultData = {
    className: "Meine Klasse",
    userName: "",
    grades: [],
    homework: [],
    schedule: [],
    breaks: [],
    events: [],
    announcements: [],
    absences: []
  };


  let data;

  try {
    data =
      JSON.parse(localStorage.getItem("klassenBoard")) ||
      structuredClone(defaultData);
  } catch {
    data = structuredClone(defaultData);
  }


  // Alte Daten kompatibel machen
  data.userName ??= "";
  data.className ??= "Meine Klasse";
  data.grades ??= [];
  data.homework ??= [];
  data.schedule ??= [];
  data.breaks ??= [];
  data.events ??= [];
  data.announcements ??= [];
  data.absences ??= [];


  let showCompletedHw = false;

  let currentDay =
    new Date().getDay() === 0
      ? 0
      : Math.min(new Date().getDay() - 1, 4);



  function save() {

    localStorage.setItem(
      "klassenBoard",
      JSON.stringify(data)
    );

    renderAll();
  }



  function id() {

    if (crypto.randomUUID) {
      return crypto.randomUUID();
    }

    return Date.now().toString(36) +
      Math.random().toString(36).slice(2);

  }



  /* =========================================
     NAVIGATION
  ========================================= */

  function showTab(tab) {

    document
      .querySelectorAll(".tab-content")
      .forEach(el => {
        el.classList.remove("active");
      });


    document
      .querySelectorAll(".nav-btn")
      .forEach(el => {
        el.classList.remove("active");
      });


    const target =
      document.getElementById("tab-" + tab);

    if (target) {
      target.classList.add("active");
    }


    const btn =
      document.querySelector(
        `[data-tab="${tab}"]`
      );

    if (btn) {
      btn.classList.add("active");
    }


    if (tab === "schedule") {
      renderSchedule();
    }

  }



  function toggleAdmin() {

    const admin =
      document.getElementById("tab-admin");

    if (admin.classList.contains("active")) {

      showTab("dashboard");

      document.getElementById("adminBtn").textContent =
        "Einstellungen";

    } else {

      showTab("admin");

      document.getElementById("adminBtn").textContent =
        "Zurück";

    }

  }



  /* =========================================
     FAB
  ========================================= */

  function toggleFab() {

    const menu =
      document.getElementById("fabMenu");

    const fab =
      document.getElementById("fab");

    menu.classList.toggle("open");
    fab.classList.toggle("open");

  }



  function closeFab() {

    document
      .getElementById("fabMenu")
      .classList.remove("open");

    document
      .getElementById("fab")
      .classList.remove("open");

  }



  /* =========================================
     MODAL
  ========================================= */

  function openAddModal(type) {

    closeFab();

    document
      .querySelectorAll(".modal-form")
      .forEach(el => {
        el.classList.add("hidden");
      });


    const form =
      document.getElementById("form-" + type);

    if (!form) return;

    form.classList.remove("hidden");


    const titles = {

      grade: "Note hinzufügen",

      homework: "Hausaufgabe hinzufügen",

      schedule: "Stunde hinzufügen",

      break: "Pause hinzufügen",

      event: "Termin hinzufügen",

      announcement: "Ankündigung hinzufügen",

      absence: "Absenz hinzufügen"

    };

  /* =========================================

  ========================================= */

  function renderGrades() {

    const list =
      document.getElementById(
        "gradesList"
      );


    if (!data.grades.length) {

      list.innerHTML =
        `<p class="text-slate-500 text-center py-8">
          Noch keine Noten eingetragen.<br>
          <span class="text-xs">
            Unten rechts auf + drücken.
          </span>
        </p>`;

      document.getElementById(
        "overallAverage"
      ).textContent = "Ø –";

      return;

    }


    const bySubject = {};


    data.grades.forEach(g => {

      if (!bySubject[g.subject]) {
        bySubject[g.subject] = [];
      }

      bySubject[g.subject].push(g);

    });


    let totalSum = 0;
    let totalWeight = 0;
    let html = "";


    for (
      const [subject, grades]
      of Object.entries(bySubject)
    ) {

      let sum = 0;
      let weight = 0;


      grades.forEach(g => {

        const num =
          parseGrade(g.value);

        const w =
          parseFloat(g.weight) || 1;


        if (num !== null) {

          sum += num * w;
          weight += w;

        }

      });


      const avg =
        weight
          ? (sum / weight).toFixed(2)
          : "–";


      totalSum += sum;
      totalWeight += weight;


      html += `
        <div class="bg-slate-900 rounded-xl border border-slate-800 overflow-hidden">

          <div class="px-4 py-3 flex items-center justify-between border-b border-slate-800">

            <span class="font-semibold">
              ${escapeHtml(subject)}
            </span>

            <span class="text-blue-400 font-medium">
              Ø ${avg}
            </span>

          </div>

          <div class="divide-y divide-slate-800">

            ${grades.map(g => `

              <div class="px-4 py-2.5 flex items-center justify-between text-sm">

                <div>

                  <span class="font-medium">
                    ${escapeHtml(g.value)}
                  </span>

                  <span class="text-slate-500 ml-2">
                    ${escapeHtml(g.type || "")}
                  </span>

                </div>

                <div class="flex items-center gap-3">

                  <span class="text-slate-500 text-xs">
                    ${formatDate(g.date)}
                  </span>

                  <button
                    onclick="deleteGrade('${g.id}')"
                    class="text-red-400 text-xs"
                  >
                    ✕
                  </button>

                </div>

              </div>

            `).join("")}

          </div>

        </div>
      `;

    }


    list.innerHTML = html;


    document.getElementById(
      "overallAverage"
    ).textContent =
      totalWeight
        ? `Ø ${(totalSum / totalWeight).toFixed(2)}`
        : "Ø –";

  }

        .trim();


    if (!text) {

      alert("Text eingeben!");

      return;

    }


    data.announcements.push({

      id: id(),

      text,

      date: today()

    });


    save();

    clearFields([
      "annText"
    ]);

    closeAddModal();

    showTab("dashboard");

  }



  /* =========================================
     ABSENZ
  ========================================= */

  function addAbsence() {

    const name =
      document
        .getElementById(
          "absName"
        )
        .value
        .trim();


    if (!name) {

      alert("Name angeben!");

      return;

    }


    data.absences.push({

      id: id(),

      name,

      date:
        document.getElementById(
          "absDate"
        ).value || today(),

      reason:
        document.getElementById(
          "absReason"
        ).value.trim()

    });


    save();

    clearFields([
      "absName",
      "absReason"
    ]);

    closeAddModal();

    showTab("absences");

  }



  function deleteAbsence(id) {

    data.absences =
      data.absences.filter(
        a => a.id !== id
      );


    save();

  }



  /* =========================================
     HILFSFUNKTIONEN
  ========================================= */

  function today() {

    return new Date()
      .toISOString()
      .slice(0, 10);

  }



  function formatDate(dateStr) {

    if (!dateStr) return "";

    const d =
      new Date(
        dateStr + "T12:00:00"
      );


    return d.toLocaleDateString(
      "de-DE",
      {
        day: "2-digit",
        month: "2-digit"
      }
    );

  }



  function clearFields(ids) {

    ids.forEach(id => {

      const el =
        document.getElementById(id);

      if (el) {
        el.value = "";
      }

    });

  }



  function parseGrade(value) {

    value =
      value
        .toString()
        .trim()
        .replace(",", ".");


    const match =
      value.match(
        /^(\d)([+-])?$/
      );


    if (!match) {

      const num =
        parseFloat(value);

      return isNaN(num)
        ? null
        : num;

    }


    let num =
      parseInt(match[1]);


    if (match[2] === "+") {
      num -= 0.3;
    }


    if (match[2] === "-") {
      num += 0.3;
    }


    return num;

  }



  function escapeHtml(value) {

    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }



  /* =========================================
     EXPORT
  ========================================= */

  function exportData() {

    const blob =
      new Blob(
        [
          JSON.stringify(
            data,
            null,
            2
          )
        ],
        {
          type: "application/json"
        }
      );


    const url =
      URL.createObjectURL(blob);


    const a =
      document.createElement("a");


    a.href = url;

    a.download =
      `klassenboard-${data.className || "export"}.json`;


    a.click();


    URL.revokeObjectURL(url);

  }



  /* =========================================
     IMPORT
  ========================================= */

  function importData() {

    const input =
      document.createElement(
        "input"
      );


    input.type = "file";

    input.accept = ".json";


    input.onchange = event => {

      const file =
        event.target.files[0];


      if (!file) return;


      const reader =
        new FileReader();


      reader.onload = e => {

        try {

          const imported =
            JSON.parse(
              e.target.result
            );


          data = {
            ...structuredClone(
              defaultData
            ),
            ...imported
          };


          save();

          alert(
            "Daten erfolgreich importiert!"
          );

        } catch {

          alert(
            "Ungültige Datei."
          );

        }

      };


      reader.readAsText(file);

    };


    input.click();

  }



  /* =========================================
     ALLES LÖSCHEN
  ========================================= */

  function clearAllData() {

    if (
      !confirm(
        "Wirklich ALLE Daten löschen? Das kann nicht rückgängig gemacht werden!"
      )
    ) return;


    data =
      structuredClone(
        defaultData
      );


    localStorage.removeItem(
      "klassenBoard"
    );


    save();


    alert(
      "Alle Daten wurden gelöscht."
    );

  }



  /* =========================================
     START
  ========================================= */

  renderAll();

</script>

</body>
</html>
