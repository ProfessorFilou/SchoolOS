<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

<title>KlassenBoard · ProfessorFilou</title>

<link rel="icon" type="image/png" href="ProfessorFilouLOGO.png">
<link rel="apple-touch-icon" href="ProfessorFilouLOGO.png">

<script src="https://cdn.tailwindcss.com"></script>

<style>
:root{
  --bg:#f4f6f9;
  --surface:rgba(255,255,255,.78);
  --surface-solid:#fff;
  --surface-2:rgba(245,247,250,.92);
  --text:#15171a;
  --muted:#70757d;
  --border:rgba(0,0,0,.08);
  --shadow:0 12px 35px rgba(0,0,0,.07);
  --accent:#2563eb;
  --accent-soft:rgba(37,99,235,.11);
  --danger:#ef4444;
  --success:#16a34a;
  --radius:22px;
}

.dark{
  --bg:#0d0f12;
  --surface:rgba(25,28,33,.82);
  --surface-solid:#191c21;
  --surface-2:#20242a;
  --text:#f4f5f7;
  --muted:#9ca3af;
  --border:rgba(255,255,255,.09);
  --shadow:0 15px 40px rgba(0,0,0,.28);
  --accent:#60a5fa;
  --accent-soft:rgba(96,165,250,.13);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  width:100%;
  min-height:100%;
  background:var(--bg);
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 10% 0%,rgba(37,99,235,.06),transparent 28%),
    radial-gradient(circle at 100% 20%,rgba(124,58,237,.05),transparent 25%),
    var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    Inter,
    system-ui,
    sans-serif;
  overflow-x:hidden;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  min-height:100vh;
}

/* =========================
   DESKTOP LAYOUT
========================= */

.sidebar{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:265px;
  padding:20px 14px;
  background:var(--surface);
  backdrop-filter:blur(28px);
  -webkit-backdrop-filter:blur(28px);
  border-right:1px solid var(--border);
  z-index:50;
  display:flex;
  flex-direction:column;
}

.main{
  margin-left:265px;
  min-height:100vh;
  width:calc(100% - 265px);
}

.content{
  width:100%;
  max-width:1600px;
  margin:auto;
  padding:24px clamp(18px,2.5vw,42px) 80px;
}

/* =========================
   BRAND
========================= */

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  padding:8px 9px 22px;
}

.brand img{
  width:42px;
  height:42px;
  object-fit:contain;
  border-radius:12px;
}

.brand-title{
  font-size:18px;
  font-weight:800;
  letter-spacing:-.4px;
}

.brand-subtitle{
  color:var(--muted);
  font-size:12px;
  margin-top:1px;
}

/* =========================
   NAV
========================= */

.nav{
  display:flex;
  flex-direction:column;
  gap:4px;
  overflow:auto;
}

.nav button{
  border:0;
  background:transparent;
  color:var(--muted);
  width:100%;
  min-height:44px;
  border-radius:13px;
  display:flex;
  align-items:center;
  gap:11px;
  padding:9px 12px;
  text-align:left;
  font-size:14px;
  transition:.18s ease;
}

.nav button:hover{
  background:var(--surface-2);
  color:var(--text);
}

.nav button.active{
  background:var(--accent-soft);
  color:var(--accent);
  font-weight:700;
}

.nav-icon{
  width:22px;
  text-align:center;
  font-size:17px;
}

.sidebar-bottom{
  margin-top:auto;
  padding-top:14px;
}

.profile-mini{
  display:flex;
  align-items:center;
  gap:10px;
  padding:11px;
  border-radius:16px;
  background:var(--surface-2);
}

.profile-avatar{
  width:34px;
  height:34px;
  border-radius:11px;
  display:grid;
  place-items:center;
  background:var(--accent-soft);
  color:var(--accent);
  font-weight:800;
}

.profile-name{
  font-weight:700;
  font-size:13px;
}

.profile-class{
  color:var(--muted);
  font-size:11px;
}

/* =========================
   TOPBAR
========================= */

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  margin-bottom:24px;
}

.page-title{
  font-size:clamp(25px,2.2vw,34px);
  line-height:1.05;
  font-weight:850;
  letter-spacing:-1px;
}

.page-subtitle{
  color:var(--muted);
  font-size:13px;
  margin-top:6px;
}

.top-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.icon-btn{
  width:42px;
  height:42px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  border-radius:14px;
  display:grid;
  place-items:center;
  box-shadow:var(--shadow);
}

.icon-btn:active{
  transform:scale(.96);
}

/* =========================
   CARDS
========================= */

.card{
  background:var(--surface);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:20px;
}

.card.compact{
  padding:16px;
}

.card-title{
  font-size:15px;
  font-weight:800;
  letter-spacing:-.2px;
}

.card-muted{
  color:var(--muted);
  font-size:12px;
}

/* =========================
   DASHBOARD
========================= */

.dashboard{
  display:grid;
  grid-template-columns:
    repeat(12,minmax(0,1fr));
  gap:16px;
}

.span-12{grid-column:span 12}
.span-8{grid-column:span 8}
.span-7{grid-column:span 7}
.span-6{grid-column:span 6}
.span-5{grid-column:span 5}
.span-4{grid-column:span 4}
.span-3{grid-column:span 3}

.now-card{
  min-height:220px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.now-label{
  color:var(--accent);
  font-size:12px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.7px;
}

.now-subject{
  font-size:clamp(28px,3vw,44px);
  font-weight:850;
  letter-spacing:-1.5px;
  margin-top:7px;
}

.now-room{
  color:var(--muted);
  margin-top:4px;
}

.progress{
  height:8px;
  border-radius:999px;
  background:var(--surface-2);
  overflow:hidden;
  margin-top:18px;
}

.progress > div{
  height:100%;
  background:var(--accent);
  border-radius:inherit;
  transition:width .4s linear;
}

.stat-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
}

.stat{
  background:var(--surface-2);
  border-radius:16px;
  padding:14px;
  min-width:0;
}

.stat-value{
  font-size:25px;
  font-weight:850;
}

.stat-label{
  color:var(--muted);
  font-size:11px;
  margin-top:2px;
}

.list{
  display:flex;
  flex-direction:column;
  gap:8px;
  margin-top:13px;
}

.list-item{
  display:flex;
  align-items:center;
  gap:11px;
  padding:11px 12px;
  border-radius:15px;
  background:var(--surface-2);
  min-width:0;
}

.list-item-main{
  min-width:0;
  flex:1;
}

.list-item-title{
  font-weight:700;
  font-size:13px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.list-item-sub{
  color:var(--muted);
  font-size:11px;
  margin-top:2px;
}

.badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border-radius:999px;
  padding:5px 9px;
  background:var(--accent-soft);
  color:var(--accent);
  font-size:10px;
  font-weight:800;
  white-space:nowrap;
}

/* =========================
   SECTIONS
========================= */

.section-header{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:12px;
  margin:24px 0 12px;
}

.section-title{
  font-size:18px;
  font-weight:850;
  letter-spacing:-.4px;
}

.section-description{
  color:var(--muted);
  font-size:12px;
  margin-top:3px;
}

/* =========================
   BUTTONS
========================= */

.btn{
  min-height:40px;
  padding:9px 14px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  border-radius:12px;
  font-size:13px;
  font-weight:700;
  transition:.15s ease;
}

.btn:hover{
  background:var(--surface-2);
}

.btn-primary{
  border-color:transparent;
  background:var(--accent);
  color:white;
}

.btn-danger{
  border-color:transparent;
  background:var(--danger);
  color:white;
}

.btn-small{
  min-height:34px;
  padding:7px 10px;
  font-size:12px;
}

/* =========================
   TABLE / TIMETABLE
========================= */

.table-wrap{
  width:100%;
  overflow:auto;
  border:1px solid var(--border);
  border-radius:18px;
}

.schedule{
  display:grid;
  grid-template-columns:74px repeat(5,minmax(150px,1fr));
  min-width:820px;
}

.schedule-head{
  padding:12px 9px;
  background:var(--surface-2);
  border-bottom:1px solid var(--border);
  font-size:12px;
  font-weight:800;
}

.period-cell{
  padding:8px;
  min-height:82px;
  border-right:1px solid var(--border);
  border-bottom:1px solid var(--border);
}

.period-number{
  font-size:12px;
  font-weight:800;
}

.period-time{
  color:var(--muted);
  font-size:10px;
  margin-top:2px;
}

.lesson{
  width:100%;
  min-height:62px;
  border:1px solid var(--border);
  border-radius:14px;
  background:var(--surface-2);
  padding:10px;
  text-align:left;
}

.lesson-name{
  font-size:12px;
  font-weight:800;
}

.lesson-teacher,
.lesson-room{
  color:var(--muted);
  font-size:10px;
  margin-top:2px;
}

.lesson.current{
  outline:2px solid var(--accent);
  background:var(--accent-soft);
}

/* =========================
   FORMS
========================= */

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.field.full{
  grid-column:1/-1;
}

.field label{
  color:var(--muted);
  font-size:11px;
  font-weight:700;
}

.field input,
.field textarea,
.field select{
  width:100%;
  min-height:42px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--surface-2);
  color:var(--text);
  padding:9px 11px;
  outline:none;
}

.field textarea{
  min-height:100px;
  resize:vertical;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
  border-color:var(--accent);
}

/* =========================
   MODAL
========================= */

.modal-layer{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(0,0,0,.35);
  backdrop-filter:blur(7px);
}

.modal-layer.show{
  display:flex;
}

.modal{
  width:min(650px,100%);
  max-height:min(88vh,800px);
  overflow:auto;
  background:var(--surface-solid);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:24px;
  box-shadow:0 30px 90px rgba(0,0,0,.25);
  padding:22px;
}

.modal-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:18px;
}

.modal-title{
  font-size:20px;
  font-weight:850;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:18px;
}

/* =========================
   FAB
========================= */

.fab{
  position:fixed;
  right:28px;
  bottom:28px;
  z-index:70;
  width:58px;
  height:58px;
  border:0;
  border-radius:20px;
  background:var(--accent);
  color:white;
  font-size:28px;
  display:grid;
  place-items:center;
  box-shadow:0 15px 35px rgba(0,0,0,.22);
  transition:.18s ease;
}

.fab:hover{
  transform:translateY(-2px);
}

.quick-menu{
  position:fixed;
  right:28px;
  bottom:96px;
  z-index:69;
  width:210px;
  padding:8px;
  border-radius:18px;
  background:var(--surface-solid);
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  display:none;
}

.quick-menu.show{
  display:block;
}

.quick-menu button{
  width:100%;
  border:0;
  background:transparent;
  color:var(--text);
  padding:11px;
  border-radius:12px;
  text-align:left;
  font-size:13px;
}

.quick-menu button:hover{
  background:var(--surface-2);
}

/* =========================
   MOBILE NAV
========================= */

.mobile-nav{
  display:none;
}

/* =========================
   EMPTY
========================= */

.empty{
  padding:28px 15px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

/* =========================
   IPAD
========================= */

/*
  iPad Landscape:
  - Sidebar bleibt sichtbar
  - Content wird kompakter
  - Karten nutzen 12er Grid
*/

@media (max-width:1180px){

  .sidebar{
    width:225px;
  }

  .main{
    margin-left:225px;
    width:calc(100% - 225px);
  }

  .content{
    padding:
      20px
      clamp(14px,2vw,28px)
      70px;
  }

  .card{
    padding:16px;
    border-radius:19px;
  }

  .dashboard{
    gap:12px;
  }

  .now-card{
    min-height:190px;
  }

  .now-subject{
    font-size:30px;
  }

  .section-title{
    font-size:16px;
  }

  .nav button{
    min-height:41px;
    font-size:13px;
  }
}

/*
  iPad Portrait:
  Hier ist besonders wichtig:
  keine zu breiten Karten,
  2-Spalten-Layout,
  kleinere Abstände.
*/

@media (min-width:700px) and (max-width:1024px){

  .sidebar{
    width:190px;
    padding:14px 9px;
  }

  .main{
    margin-left:190px;
    width:calc(100% - 190px);
  }

  .content{
    padding:16px 14px 65px;
  }

  .brand{
    padding-bottom:14px;
  }

  .brand img{
    width:36px;
    height:36px;
  }

  .brand-title{
    font-size:15px;
  }

  .brand-subtitle{
    font-size:10px;
  }

  .nav button{
    min-height:39px;
    padding:8px 9px;
    font-size:12px;
    gap:8px;
  }

  .nav-icon{
    font-size:15px;
  }

  .dashboard{
    grid-template-columns:repeat(6,minmax(0,1fr));
    gap:10px;
  }

  .span-12,
  .span-8,
  .span-7{
    grid-column:span 6;
  }

  .span-6{
    grid-column:span 3;
  }

  .span-5,
  .span-4,
  .span-3{
    grid-column:span 3;
  }

  .card{
    padding:14px;
    border-radius:17px;
  }

  .now-card{
    min-height:180px;
  }

  .now-subject{
    font-size:27px;
  }

  .stat{
    padding:11px;
  }

  .stat-value{
    font-size:21px;
  }

  .list-item{
    padding:9px 10px;
  }

  .fab{
    right:20px;
    bottom:20px;
  }
}

/* =========================
   PHONE
========================= */

@media (max-width:699px){

  body{
    padding-bottom:72px;
  }

  .sidebar{
    display:none;
  }

  .main{
    margin:0;
    width:100%;
  }

  .content{
    padding:14px 12px 90px;
  }

  .topbar{
    margin-bottom:17px;
  }

  .page-title{
    font-size:25px;
  }

  .page-subtitle{
    font-size:11px;
  }

  .dashboard{
    grid-template-columns:1fr;
    gap:10px;
  }

  .span-12,
  .span-8,
  .span-7,
  .span-6,
  .span-5,
  .span-4,
  .span-3{
    grid-column:span 1;
  }

  .card{
    padding:14px;
    border-radius:17px;
  }

  .now-card{
    min-height:180px;
  }

  .now-subject{
    font-size:29px;
  }

  .stat-grid{
    gap:7px;
  }

  .stat{
    padding:10px;
  }

  .stat-value{
    font-size:20px;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

  .mobile-nav{
    position:fixed;
    left:8px;
    right:8px;
    bottom:8px;
    height:60px;
    z-index:60;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:4px;
    padding:5px;
    background:var(--surface-solid);
    border:1px solid var(--border);
    border-radius:20px;
    box-shadow:0 15px 40px rgba(0,0,0,.18);
  }

  .mobile-nav button{
    border:0;
    background:transparent;
    color:var(--muted);
    border-radius:15px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:1px;
    font-size:9px;
  }

  .mobile-nav button.active{
    background:var(--accent-soft);
    color:var(--accent);
    font-weight:800;
  }

  .mobile-nav span:first-child{
    font-size:17px;
  }

  .fab{
    right:15px;
    bottom:82px;
    width:52px;
    height:52px;
    border-radius:18px;
  }

  .quick-menu{
    right:15px;
    bottom:143px;
  }

  .top-actions .icon-btn{
    width:38px;
    height:38px;
  }
}

/* =========================
   ACCESSIBILITY / SAFE AREA
========================= */

@supports(padding:max(0px)){
  .mobile-nav{
    padding-bottom:max(5px,env(safe-area-inset-bottom));
  }

  body{
    padding-bottom:max(72px,calc(72px + env(safe-area-inset-bottom)));
  }
}

.hidden{
  display:none!important;
}

.no-select{
  user-select:none;
}
</style>
</head>

<body>

<div class="app">

  <!-- =========================
       SIDEBAR
  ========================== -->

  <aside class="sidebar">

    <div class="brand">
      <img src="ProfessorFilouLOGO.png" alt="ProfessorFilou">
      <div>
        <div class="brand-title">KlassenBoard</div>
        <div class="brand-subtitle">ProfessorFilou</div>
      </div>
    </div>

    <nav class="nav" id="sidebarNav">

      <button data-page="dashboard" class="active">
        <span class="nav-icon">⌂</span>
        <span>Dashboard</span>
      </button>

      <button data-page="now">
        <span class="nav-icon">◷</span>
        <span>Jetzt</span>
      </button>

      <button data-page="schedule">
        <span class="nav-icon">▦</span>
        <span>Stundenplan</span>
      </button>

      <button data-page="tasks">
        <span class="nav-icon">✓</span>
        <span>Aufgaben</span>
      </button>

      <button data-page="backpack">
        <span class="nav-icon">▢</span>
        <span>Rucksack</span>
      </button>

      <button data-page="calendar">
        <span class="nav-icon">□</span>
        <span>Kalender</span>
      </button>

      <button data-page="grades">
        <span class="nav-icon">◇</span>
        <span>Noten</span>
      </button>

      <button data-page="learning">
        <span class="nav-icon">✦</span>
        <span>Lernen</span>
      </button>

      <button data-page="notes">
        <span class="nav-icon">▤</span>
        <span>Notizen</span>
      </button>

      <button data-page="checklists">
        <span class="nav-icon">☑</span>
        <span>Checklisten</span>
      </button>

      <button data-page="subjects">
        <span class="nav-icon">●</span>
        <span>Fächer</span>
      </button>

      <button data-page="teachers">
        <span class="nav-icon">♙</span>
        <span>Lehrer</span>
      </button>

      <button data-page="substitutions">
        <span class="nav-icon">↔</span>
        <span>Vertretungen</span>
      </button>

      <button data-page="settings">
        <span class="nav-icon">⚙</span>
        <span>Einstellungen</span>
      </button>

    </nav>

const STORAGE_KEY = "klassenboard_v5";

let data = loadData();

let modalState = null;


/* =========================================================
   STORAGE
========================================================= */

function loadData(){

  try{

    const saved = localStorage.getItem(STORAGE_KEY);

    if(!saved){
      return structuredClone(defaultData);
    }

    return {
      ...structuredClone(defaultData),
      ...JSON.parse(saved)
    };

  }catch(e){

    console.error(e);

    return structuredClone(defaultData);

  }

}


function save(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );

  updateProfile();

}


/* =========================================================
   HELPERS
========================================================= */

const days = [
  "Montag",
  "Dienstag",
  "Mittwoch",
  "Donnerstag",
  "Freitag"
];


function uid(){

  return Date.now().toString(36)
    + Math.random().toString(36).slice(2);

}


function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function formatDate(date){

  return new Intl.DateTimeFormat(
    "de-DE",
    {
      weekday:"short",
      day:"2-digit",
      month:"2-digit"
    }
  ).format(date);

}


function todayISO(){

  const d = new Date();

  const y = d.getFullYear();

  const m = String(d.getMonth()+1)
    .padStart(2,"0");

  const day = String(d.getDate())
    .padStart(2,"0");

  return `${y}-${m}-${day}`;

}


function getSubject(id){

  return data.subjects.find(x => x.id === id);

}


function subjectName(id){

  return getSubject(id)?.name || "Ohne Fach";

}


function subjectColor(id){

  const colors = [
    "#2563eb",
    "#7c3aed",
    "#059669",
    "#ea580c",
    "#db2777",
    "#0891b2",
    "#65a30d"
  ];

  let n = 0;

  for(const c of String(id||"")){
    n += c.charCodeAt(0);
  }

  return colors[n % colors.length];

}

function toggleTheme(){

}

function getCurrentLesson(){

  const now = new Date();

  const day = now.getDay();

  if(day < 1 || day > 5){
    return null;
  }

  const dayName = days[day-1];

  const minutes =
    now.getHours()*60 +
    now.getMinutes();

  return data.schedule.find(lesson => {

    if(lesson.day !== dayName){
      return false;
    }

    const [sh,sm] =
      lesson.from.split(":").map(Number);

    const [eh,em] =
      lesson.to.split(":").map(Number);

    const start = sh*60+sm;
    const end = eh*60+em;

    return minutes >= start && minutes < end;

  }) || null;

}


function getNextLessons(){

  const now = new Date();

  const day = now.getDay();

  if(day < 1 || day > 5){
    return [];
  }

  const dayName = days[day-1];

  const minutes =
    now.getHours()*60 +
    now.getMinutes();

  return data.schedule

    .filter(x => x.day === dayName)

    .filter(x => {

      const [h,m] =
        x.from.split(":").map(Number);

      return h*60+m > minutes;

    })

    .sort((a,b) =>
      a.period - b.period
    )

    .slice(0,4);

}


function getOpenTasks(){

  return data.tasks
    .filter(x => !x.done)
    .sort((a,b) =>
      String(a.date||"9999")
        .localeCompare(String(b.date||"9999"))
    );

}


function averageGrade(){

  if(!data.grades.length){
    return "—";
  }

  const values =
    data.grades
      .map(x => Number(x.grade))
      .filter(x => !isNaN(x));

  if(!values.length){
    return "—";
  }

  const avg =
    values.reduce((a,b)=>a+b,0)
    / values.length;

  return avg.toFixed(2)
    .replace(".",",");

}


function renderDashboard(){

      <!-- TASKS -->

      <section class="card span-6">

        <div class="card-title">

        ${

      <!-- TODAY -->

        ${
          todayTasks.length
          ? `
            <div class="list">

              ${todayTasks.map(x => `

                <div class="list-item">

                  <div class="list-item-main">

                    <div class="list-item-title">
                      ${escapeHTML(x.title)}
                    </div>

      <!-- TOMORROW -->

      <section class="card span-6">

        <div class="card-title">
          Morgen

        <div class="list">

          ${

              .slice(0,5)

                    <div class="list-item-sub">

                    ${x.period}. Std.
                  </span>

              `).join("")
            ||
            `<div class="empty">Keine Stunden eingetragen.</div>`
          }

        </div>

      </section>

    </div>

  `;

}


function getTomorrowLessons(){

  const day = new Date().getDay();

  if(day >= 5 || day === 0){
    return data.schedule
      .filter(x => x.day === "Montag")
      .sort((a,b)=>a.period-b.period);
  }

  const tomorrow = days[day];

  return data.schedule
    .filter(x => x.day === tomorrow)
    .sort((a,b)=>a.period-b.period);

}


function completeTask(id){

  const item =
    data.tasks.find(x => x.id === id);

  if(item){
    item.done = true;
    save();
    render();
  }

}

function getTodaySchedule(){

  return data.schedule
    .filter(x => x.day === days[day-1])
    .sort((a,b)=>a.period-b.period);

}

            #
          </div>

            <div class="schedule-head">
              ${day.slice(0,2)}

          `).join("")}

          ${
            Array.from({length:12},(_,i)=>{

              const period = i+1;

              return `

                <div class="period-cell">

                  <div class="period-number">
                    ${period}
                  </div>

                  ${
                    getPeriodTime(period)
                      ? `
                        <div class="period-time">
                          ${getPeriodTime(period)}
                        </div>
                      `
                      : ""
                  }

                </div>

                ${days.map(day => {

                  const lesson =
                    data.schedule.find(x =>
                      x.day === day &&
                      Number(x.period) === period
                    );

                  if(!lesson){

                    return `
                      <div class="period-cell">
                        <button
                          class="lesson"
                          onclick="openScheduleFor('${day}',${period})"
                          style="
                            color:var(--muted);
                            border-style:dashed;
                          ">
                          + Eintragen
                        </button>
                      </div>
                    `;

                  }

                  return `

                    <div class="period-cell">

                      <button
                        class="lesson current"
                        style="
                          outline:none;
                          border-left:4px solid ${subjectColor(lesson.subjectId)};
                        "
                        onclick="editSchedule('${lesson.id}')">

                        <div class="lesson-name">
                          ${escapeHTML(subjectName(lesson.subjectId))}
                        </div>

                        <div class="lesson-teacher">
                          ${escapeHTML(lesson.teacher || "")}
                        </div>

                        <div class="lesson-room">
                          ${escapeHTML(lesson.room || "")}
                        </div>

                        <div class="lesson-room">
                          ${escapeHTML(lesson.from)}–${escapeHTML(lesson.to)}
                        </div>

                      </button>

                    </div>

                  `;

                }).join("")}

              `;

            }).join("")
          }

        </div>

      </div>

    </div>


    <div class="section-header">
      <div>
        <div class="section-title">Pausen</div>
        <div class="section-description">
          Pausenzeiten für deinen Schulalltag
        </div>
      </div>

      <button class="btn"
              onclick="openModal('break')">
        + Pause
      </button>
    </div>


    <div class="dashboard">

      ${
        data.breaks.map(x=>`

          <div class="card span-3">

            <div class="card-title">
              ${escapeHTML(x.name)}
            </div>

            <div class="card-muted">
              ${escapeHTML(x.from)}–${escapeHTML(x.to)}
            </div>

            <button
              class="btn btn-small btn-danger"
              style="margin-top:10px"
              onclick="deleteItem('breaks','${x.id}')">
              Löschen
            </button>

          </div>

        `).join("")
        ||
        `<div class="card span-12">
          <div class="empty">Noch keine Pausen eingetragen.</div>
        </div>`
      }

    </div>

  `;

  return html;

}


function getPeriodTime(period){

  const item =
    data.schedule.find(x =>
      Number(x.period) === period &&
      x.from &&
      x.to
    );

  if(!item){
    return "";
  }

  return `${item.from}–${item.to}`;

}


function openScheduleFor(day,period){

  openModal("schedule",{
    day,
    period
  });

}


function editSchedule(id){

  const lesson =
    data.schedule.find(x=>x.id===id);

  if(lesson){

    openModal(
      "schedule",
      {
        edit:lesson
      }
    );

  }

}

function renderTasks(){

  const all = [
    ...data.homework.map(x=>({
      ...x,

    ...data.tasks.map(x=>({

let timerSeconds = 25*60;
let timerInterval = null;


function startTimer(){

  if(timerInterval){
    return;
  }

  timerInterval =
    setInterval(()=>{

      if(timerSeconds <= 0){

        clearInterval(timerInterval);
        timerInterval = null;

        return;

      }

      timerSeconds--;

      updateTimer();

    },1000);

}


function resetTimer(){

  clearInterval(timerInterval);

  timerInterval = null;

  timerSeconds = 25*60;

  updateTimer();

}


function updateTimer(){

  const el =
    document.getElementById("studyTimer");

  if(!el){
    return;
  }

  const min =
    String(Math.floor(timerSeconds/60))
      .padStart(2,"0");

  const sec =
    String(timerSeconds%60)
      .padStart(2,"0");

  el.textContent = `${min}:${sec}`;

}

function openModal(type,preset={}){

  modalState = {
    type,
    preset
  };

  const layer =
    document.getElementById("modalLayer");

  layer.classList.add("show");

  renderModal();

  document
    .getElementById("quickMenu")
    .classList.remove("show");

}


function closeModal(){

  document
    .getElementById("modalLayer")
    .classList.remove("show");

  modalState = null;

}


document

  .addEventListener("click",e=>{

    if(e.target.id === "modalLayer"){

function submitSchedule(){

  const day =
    document.getElementById("fScheduleDay").value;

  const period =
    Number(
      document.getElementById("fSchedulePeriod").value
    );

  const subjectId =
    document.getElementById("fScheduleSubject").value;

  if(!subjectId){
    alert("Bitte ein Fach auswählen.");
    return;
  }

  const edit =
    modalState.preset.edit;

  const existing =
    data.schedule.find(x =>
      x.day === day &&
      Number(x.period) === period &&
      x.id !== edit?.id
    );

  const lesson = {

    id:edit?.id || uid(),

    day,

    period,

    subjectId,

    from:
      document.getElementById("fScheduleFrom").value,

    to:
      document.getElementById("fScheduleTo").value,

    room:
      document.getElementById("fScheduleRoom").value.trim(),

    teacher:
      document.getElementById("fScheduleTeacher").value.trim()

  };

  if(existing){

    if(!confirm(
      "Für diesen Tag und diese Stunde gibt es bereits einen Eintrag. Ersetzen?"
    )){
      return;
    }

    const index =
      data.schedule.findIndex(x=>x.id===existing.id);

    data.schedule[index] = lesson;

  }else if(edit){

    const index =
      data.schedule.findIndex(x=>x.id===edit.id);

    data.schedule[index] = lesson;

  }else{

    data.schedule.push(lesson);

  }

  save();
  closeModal();
  render();

}


function deleteSchedule(id){

  if(!confirm("Stunde wirklich löschen?")){
    return;
  }

  data.schedule =
    data.schedule.filter(x=>x.id!==id);

  save();

/* =========================================================
   SEARCH
========================================================= */

function openSearch(){

  const query =
    prompt("Was möchtest du suchen?");

  if(!query){
    return;
  }

  const q =
    query.toLowerCase();

  const results = [];

  data.notes.forEach(x=>{

    if(
      x.title.toLowerCase().includes(q) ||
      x.text.toLowerCase().includes(q)
    ){

      results.push({
        type:"Notiz",
        title:x.title
      });

    }

  });

  data.homework.forEach(x=>{

    if(x.title.toLowerCase().includes(q)){

      results.push({
        type:"Hausaufgabe",
        title:x.title
      });

    }

  });

  data.tasks.forEach(x=>{

    if(x.title.toLowerCase().includes(q)){

      results.push({
        type:"Aufgabe",
        title:x.title
      });

    }

  });

  alert(
    results.length
      ? results
          .slice(0,10)
          .map(x=>`${x.type}: ${x.title}`)
          .join("\n")
      : "Nichts gefunden."
  );

}


/* =========================================================
   IMPORT / EXPORT
========================================================= */

function exportData(){

  const blob =
    new Blob(
      [JSON.stringify(data,null,2)],
      {type:"application/json"}
    );

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;

  a.download =
    "KlassenBoard-Backup.json";

  a.click();

  URL.revokeObjectURL(url);

}


function importData(event){

  const file =
    event.target.files[0];

  if(!file){
    return;
  }

  const reader =
    new FileReader();

  reader.onload = () => {

    try{

      const imported =
        JSON.parse(reader.result);

      data = {
        ...structuredClone(defaultData),
        ...imported
      };

      save();

      applyTheme();

      render();

      alert("Import erfolgreich.");

    }catch{

      alert("Die Datei konnte nicht gelesen werden.");

    }

  };

  reader.readAsText(file);

}


function resetAll(){

  if(!confirm(
    "Wirklich ALLE KlassenBoard-Daten löschen?"
  )){
    return;
  }

  localStorage.removeItem(STORAGE_KEY);

  data =
    structuredClone(defaultData);

  applyTheme();

  updateProfile();

  navigate("dashboard");

}

   LIVE LESSON UPDATE
========================================================= */

function updateCurrentLessonUI(){

  const current =
    getCurrentLesson();

  if(!current){
    return;
  }

  const now = new Date();

  const [sh,sm] =
    current.from.split(":").map(Number);

  const [eh,em] =
    current.to.split(":").map(Number);

  const start =
    sh*60+sm;

  const end =
    eh*60+em;

  const currentMinutes =
    now.getHours()*60 +
    now.getMinutes() +
    now.getSeconds()/60;

  const percent =
    Math.min(
      100,
      Math.max(
        0,
        ((currentMinutes-start)/(end-start))*100
      )
    );

  const progress =
    document.getElementById("lessonProgress");

  if(progress){
    progress.style.width =
      percent + "%";
  }

  const progress2 =
    document.getElementById("nowProgress");

  if(progress2){
    progress2.style.width =
      percent + "%";
  }

  const remaining =
    Math.max(
      0,
      Math.ceil(end-currentMinutes)
    );

  const remainingText =
    remaining >= 60
      ? `${Math.floor(remaining/60)}h ${remaining%60}m`
      : `${remaining} min`;

  const r1 =
    document.getElementById("remainingTime");

  const r2 =
    document.getElementById("nowRemaining");

  if(r1){
    r1.textContent =
      `${remainingText} übrig`;
  }

  if(r2){
    r2.textContent =
      `${remainingText} übrig`;
  }

}


setInterval(updateCurrentLessonUI,1000);


/* =========================================================
   RENDER
========================================================= */

function render(){

  const page =
    document.getElementById("page");

  switch(currentPage){

    case "dashboard":
      page.innerHTML = renderDashboard();
      break;

    case "now":
      page.innerHTML = renderNow();
      break;

    case "schedule":
      page.innerHTML = renderSchedule();
      break;

    case "tasks":
      page.innerHTML = renderTasks();
      break;

    case "backpack":
      page.innerHTML = renderBackpack();
      break;

    case "calendar":
      page.innerHTML = renderCalendar();
      break;

    case "grades":
      page.innerHTML = renderGrades();
      break;

    case "learning":
      page.innerHTML = renderLearning();
      break;

    case "notes":
      page.innerHTML = renderNotes();
      break;

    case "checklists":
      page.innerHTML = renderChecklists();
      break;

    case "subjects":
      page.innerHTML = renderSubjects();
      break;

    case "teachers":
      page.innerHTML = renderTeachers();
      break;

    case "substitutions":
      page.innerHTML = renderSubstitutions();
      break;

    case "settings":
      page.innerHTML = renderSettings();
      break;

    default:
      page.innerHTML = renderDashboard();

  }

  updateCurrentLessonUI();

}


render();


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener("keydown",e=>{

  if(e.key === "Escape"){
    closeModal();

    document
      .getElementById("quickMenu")
      .classList.remove("show");
  }

});


/* =========================================================
   CLOSE QUICK MENU OUTSIDE
========================================================= */

document.addEventListener("click",e=>{

  const menu =
    document.getElementById("quickMenu");

  const fab =
    document.getElementById("fab");

  if(
    menu.classList.contains("show") &&
    !menu.contains(e.target) &&
    !fab.contains(e.target)
  ){

    menu.classList.remove("show");

  }

});

</script>
