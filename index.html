<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#f4f6f9">

<link rel="icon" type="image/png" href="ProfessorFilouLOGO.png">
<link rel="apple-touch-icon" href="ProfessorFilouLOGO.png">

<title>KlassenBoard · ProfessorFilou</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

/* =========================================================
   VARIABLES
========================================================= */

:root{
  --bg:#f4f6f8;
  --card:rgba(255,255,255,.82);
  --card-solid:#ffffff;
  --soft:#f0f2f5;
  --text:#15171b;
  --muted:#747982;
  --border:rgba(0,0,0,.075);
  --accent:#2563eb;
  --accent-soft:rgba(37,99,235,.10);
  --danger:#ef4444;
  --success:#16a34a;
  --warning:#f59e0b;

  --radius:20px;

  --sidebar:250px;

  --shadow:
    0 8px 30px rgba(0,0,0,.055);

  --shadow-hover:
    0 14px 38px rgba(0,0,0,.09);
}

html.dark{
  --bg:#0d0f12;
  --card:rgba(25,28,33,.84);
  --card-solid:#191c21;
  --soft:#20242a;
  --text:#f4f5f7;
  --muted:#969ca5;
  --border:rgba(255,255,255,.085);
  --accent:#60a5fa;
  --accent-soft:rgba(96,165,250,.13);

  --shadow:
    0 10px 35px rgba(0,0,0,.25);

  --shadow-hover:
    0 15px 42px rgba(0,0,0,.35);
}


/* =========================================================
   GLOBAL
========================================================= */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  min-height:100%;
}

body{
  background:
    radial-gradient(
      circle at 0% 0%,
      rgba(37,99,235,.07),
      transparent 28%
    ),
    radial-gradient(
      circle at 100% 10%,
      rgba(124,58,237,.055),
      transparent 25%
    ),
    var(--bg);

  color:var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    Inter,
    system-ui,
    sans-serif;

  overflow-x:hidden;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}


/* =========================================================
   SCROLLBAR
========================================================= */

::-webkit-scrollbar{
  width:7px;
  height:7px;
}

::-webkit-scrollbar-thumb{
  background:rgba(120,125,135,.3);
  border-radius:999px;
}

::-webkit-scrollbar-track{
  background:transparent;
}


/* =========================================================
   APP
========================================================= */

.app{
  min-height:100vh;
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{
  position:fixed;
  z-index:50;

  left:0;
  top:0;
  bottom:0;

  width:var(--sidebar);

  padding:17px 12px;

  background:var(--card);

  backdrop-filter:blur(28px);
  -webkit-backdrop-filter:blur(28px);

  border-right:1px solid var(--border);

  display:flex;
  flex-direction:column;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;

  padding:7px 9px 18px;
}

.logo img{
  width:39px;
  height:39px;

  object-fit:contain;

  border-radius:11px;
}

.logo-title{
  font-size:16px;
  font-weight:850;
  letter-spacing:-.35px;
}

.logo-sub{
  margin-top:1px;

  color:var(--muted);

  font-size:10px;
}


/* =========================================================
   SIDEBAR NAV
========================================================= */

.side-nav{
  display:flex;
  flex-direction:column;
  gap:3px;

  overflow-y:auto;

  padding-right:2px;
}

.side-btn{
  width:100%;
  min-height:42px;

  border:0;

  background:transparent;

  color:var(--muted);

  border-radius:13px;

  display:flex;
  align-items:center;

  gap:10px;

  padding:8px 11px;

  font-size:13px;
  font-weight:600;

  text-align:left;

  transition:
    background .18s ease,
    color .18s ease,
    transform .18s ease;
}

.side-btn:hover{
  background:var(--soft);
  color:var(--text);
}

.side-btn:active{
  transform:scale(.975);
}

.side-btn.active{
  background:var(--accent-soft);
  color:var(--accent);
  font-weight:750;
}

.side-icon{
  width:22px;
  min-width:22px;

  text-align:center;

  font-size:16px;
}

.sidebar-profile{
  margin-top:auto;

  padding-top:12px;
}

.profile{
  display:flex;
  align-items:center;
  gap:9px;

  padding:10px;

  background:var(--soft);

  border:1px solid var(--border);

  border-radius:15px;
}

.avatar{
  width:33px;
  height:33px;

  display:grid;
  place-items:center;

  border-radius:10px;

  background:var(--accent-soft);
  color:var(--accent);

  font-size:13px;
  font-weight:850;
}

.profile-name{
  font-size:12px;
  font-weight:750;
}

.profile-class{
  color:var(--muted);
  font-size:10px;
}


/* =========================================================
   MAIN
========================================================= */

.main{
  margin-left:var(--sidebar);

  min-height:100vh;

  width:calc(100% - var(--sidebar));
}

.content{
  width:100%;
  max-width:1660px;

  margin:0 auto;

  padding:
    23px
    clamp(20px,2.6vw,44px)
    100px;
}


/* =========================================================
   TOPBAR
========================================================= */

.topbar{
  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:15px;

  margin-bottom:20px;
}

.title{
  font-size:clamp(26px,2.3vw,35px);

  font-weight:880;

  letter-spacing:-1.15px;

  line-height:1.05;
}

.subtitle{
  margin-top:6px;

  color:var(--muted);

  font-size:12px;
}

.top-actions{
  display:flex;
  align-items:center;
  gap:7px;
}

.icon-btn{
  width:40px;
  height:40px;

  display:grid;
  place-items:center;

  border:1px solid var(--border);

  border-radius:13px;

  background:var(--card);

  color:var(--text);

  box-shadow:var(--shadow);

  transition:
    transform .18s ease,
    background .18s ease;
}

.icon-btn:hover{
  background:var(--soft);
  transform:translateY(-1px);
}

.icon-btn:active{
  transform:scale(.94);
}


/* =========================================================
   PAGE ANIMATION
========================================================= */

.page-animation{
  animation:
    pageIn .28s cubic-bezier(.2,.8,.2,1);
}

@keyframes pageIn{
  from{
    opacity:0;
    transform:translateY(8px);
  }

  to{
    opacity:1;
    transform:none;
  }
}


/* =========================================================
   GRID
========================================================= */

.grid{
  display:grid;

  grid-template-columns:
    repeat(12,minmax(0,1fr));

  gap:14px;
}

.c12{grid-column:span 12}
.c9{grid-column:span 9}
.c8{grid-column:span 8}
.c7{grid-column:span 7}
.c6{grid-column:span 6}
.c5{grid-column:span 5}
.c4{grid-column:span 4}
.c3{grid-column:span 3}


/* =========================================================
   CARD
========================================================= */

.card{
  min-width:0;

  background:var(--card);

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  border:1px solid var(--border);

  border-radius:var(--radius);

  box-shadow:var(--shadow);

  padding:17px;

  transition:
    transform .2s cubic-bezier(.2,.8,.2,1),
    box-shadow .2s ease,
    border-color .2s ease;
}

.card-hover:hover{
  transform:translateY(-2px);
  box-shadow:var(--shadow-hover);
}

.card-head{
  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:10px;
}

.card-title{
  font-size:14px;
  font-weight:820;

  letter-spacing:-.2px;
}

.card-sub{
  margin-top:3px;

  color:var(--muted);

  font-size:10px;
}


/* =========================================================
   HERO
========================================================= */

.hero{
  min-height:210px;

  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.eyebrow{
  color:var(--accent);

  font-size:10px;
  font-weight:850;

  text-transform:uppercase;

  letter-spacing:1px;
}

.hero-title{
  margin-top:7px;

  font-size:clamp(27px,3vw,43px);

  font-weight:900;

  letter-spacing:-1.7px;

  line-height:1;
}

.hero-meta{
  margin-top:7px;

  color:var(--muted);

  font-size:12px;
}

.progress{
  width:100%;
  height:7px;

  margin-top:17px;

  background:var(--soft);

  border-radius:999px;

  overflow:hidden;
}

.progress-fill{
  height:100%;
  width:0%;

  background:var(--accent);

  border-radius:inherit;

  transition:width .5s ease;
}

.progress-row{
  display:flex;

  justify-content:space-between;

  margin-top:6px;

  color:var(--muted);

  font-size:9px;
}


/* =========================================================
   STAT
========================================================= */

.stats{
  display:grid;

  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap:8px;

  margin-top:13px;
}

.stat{
  min-width:0;

  background:var(--soft);

  border-radius:14px;

  padding:11px;
}

.stat-number{
  font-size:22px;

  line-height:1;

  font-weight:880;

  letter-spacing:-.7px;
}

.stat-label{
  margin-top:4px;

  color:var(--muted);

  font-size:9px;
}


/* =========================================================
   LIST
========================================================= */

.list{
  display:flex;
  flex-direction:column;

  gap:6px;

  margin-top:11px;
}

.item{
  min-width:0;

  display:flex;
  align-items:center;

  gap:9px;

  padding:9px 10px;

  border-radius:13px;

  background:var(--soft);

  border:1px solid transparent;

  transition:
    transform .16s ease,
    border-color .16s ease;
}

.item:hover{
  border-color:var(--border);
  transform:translateX(2px);
}

.item-main{
  flex:1;
  min-width:0;
}

.item-title{
  font-size:12px;
  font-weight:730;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.item-sub{
  margin-top:2px;

  color:var(--muted);

  font-size:9px;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}


/* =========================================================
   BADGE
========================================================= */

.badge{
  display:inline-flex;

  align-items:center;
  justify-content:center;

  min-height:23px;

  padding:4px 8px;

  border-radius:999px;

  background:var(--accent-soft);

  color:var(--accent);

  font-size:9px;

  font-weight:800;

  white-space:nowrap;
}


/* =========================================================
   BUTTONS
========================================================= */

.btn{
  min-height:37px;

  padding:8px 12px;

  border:1px solid var(--border);

  border-radius:11px;

  background:var(--card);

  color:var(--text);

  font-size:11px;

  font-weight:730;

  transition:
    transform .15s ease,
    background .15s ease;
}

.btn:hover{
  background:var(--soft);
}

.btn:active{
  transform:scale(.96);
}

.btn-primary{
  border-color:transparent;

  background:var(--accent);

  color:white;
}

.btn-danger{
  border-color:transparent;

  background:var(--danger);

  color:white;
}

.btn-small{
  min-height:30px;

  padding:6px 9px;

  font-size:10px;
}


/* =========================================================
   SECTION
========================================================= */

.section{
  margin-top:21px;
}

.section-head{
  display:flex;

  align-items:end;
  justify-content:space-between;

  gap:10px;

  margin-bottom:10px;
}

.section-title{
  font-size:16px;

  font-weight:850;

  letter-spacing:-.35px;
}

.section-sub{
  color:var(--muted);

  font-size:10px;

  margin-top:2px;
}


/* =========================================================
   SCHEDULE
========================================================= */

.schedule-wrap{
  overflow:auto;

  border:1px solid var(--border);

  border-radius:17px;
}

.schedule{
  min-width:920px;

  display:grid;

  grid-template-columns:
    60px
    repeat(5,minmax(170px,1fr));
}

.schedule-cell{
  min-height:82px;

  padding:7px;

  border-right:1px solid var(--border);
  border-bottom:1px solid var(--border);
}

.schedule-head{
  min-height:40px;

  display:flex;
  align-items:center;

  padding:8px;

  background:var(--soft);

  font-size:10px;

  font-weight:820;
}

.period{
  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  gap:2px;

  color:var(--muted);
}

.period-number{
  font-size:12px;

  color:var(--text);

  font-weight:850;
}

.period-time{
  font-size:8px;
}

.lesson{
  width:100%;
  height:100%;

  min-height:67px;

  padding:9px;

  border-radius:13px;

  border:1px solid var(--border);

  background:var(--soft);

  text-align:left;

  transition:
    transform .16s ease,
    box-shadow .16s ease;
}

.lesson:hover{
  transform:translateY(-1px);

  box-shadow:0 5px 15px rgba(0,0,0,.06);
}

.lesson-name{
  font-size:11px;

  font-weight:820;
}

.lesson-meta{
  color:var(--muted);

  font-size:8px;

  margin-top:3px;
}

.lesson-empty{
  width:100%;
  height:100%;

  min-height:67px;

  display:grid;
  place-items:center;

  border:1px dashed var(--border);

  border-radius:13px;

  background:transparent;

  color:var(--muted);

  font-size:10px;

  transition:.15s ease;
}

.lesson-empty:hover{
  background:var(--accent-soft);
  color:var(--accent);
}

.lesson-current{
  outline:2px solid var(--accent);
  outline-offset:-2px;
}


/* =========================================================
   FORM
========================================================= */

.form{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:11px;
}

.field{
  display:flex;
  flex-direction:column;

  gap:5px;
}

.field.full{
  grid-column:1/-1;
}

.field label{
  color:var(--muted);

  font-size:9px;

  font-weight:760;
}

.field input,
.field textarea,
.field select{
  width:100%;

  min-height:41px;

  padding:9px 10px;

  border-radius:11px;

  border:1px solid var(--border);

  outline:none;

  background:var(--soft);

  color:var(--text);

  font-size:11px;

  transition:
    border-color .15s ease,
    box-shadow .15s ease;
}

.field textarea{
  min-height:95px;

  resize:vertical;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
  border-color:var(--accent);

  box-shadow:
    0 0 0 3px var(--accent-soft);
}

.form-actions{
  grid-column:1/-1;

  display:flex;

  justify-content:flex-end;

  gap:7px;

  margin-top:3px;
}


/* =========================================================
   EMPTY
========================================================= */

.empty{
  padding:25px 12px;

  color:var(--muted);

  text-align:center;

  font-size:11px;
}


/* =========================================================
   MODAL
========================================================= */

.modal-backdrop{
  position:fixed;

  inset:0;

  z-index:100;

  display:none;

  align-items:center;
  justify-content:center;

  padding:15px;

  background:rgba(0,0,0,.32);

  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}

.modal-backdrop.show{
  display:flex;

  animation:fadeIn .18s ease;
}

.modal{
  width:min(650px,100%);

  max-height:min(88vh,800px);

  overflow:auto;

  padding:20px;

  border-radius:23px;

  background:var(--card-solid);

  border:1px solid var(--border);

  box-shadow:
    0 30px 90px rgba(0,0,0,.23);

  animation:
    modalIn .25s cubic-bezier(.2,.8,.2,1);
}

@keyframes fadeIn{
  from{opacity:0}
  to{opacity:1}
}

@keyframes modalIn{
  from{
    opacity:0;
    transform:translateY(12px) scale(.96);
  }

  to{
    opacity:1;
    transform:none;
  }
}

.modal-head{
  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:10px;

  margin-bottom:17px;
}

.modal-title{
  font-size:19px;

  font-weight:880;

  letter-spacing:-.55px;
}


/* =========================================================
   QUICK ADD
========================================================= */

.fab{
  position:fixed;

  right:27px;
  bottom:27px;

  z-index:70;

  width:55px;
  height:55px;

  border:0;

  border-radius:18px;

  background:var(--accent);

  color:white;

  font-size:28px;

  box-shadow:
    0 13px 35px rgba(0,0,0,.22);

  transition:
    transform .22s cubic-bezier(.2,.8,.2,1),
    border-radius .22s ease;
}

.fab.open{
  transform:rotate(45deg);
  border-radius:50%;
}

.quick{
  position:fixed;

  right:27px;
  bottom:94px;

  z-index:69;

  width:215px;

  padding:7px;

  border-radius:18px;

  background:var(--card-solid);

  border:1px solid var(--border);

  box-shadow:var(--shadow-hover);

  opacity:0;

  pointer-events:none;

  transform:
    translateY(8px)
    scale(.96);

  transition:
    opacity .18s ease,
    transform .2s cubic-bezier(.2,.8,.2,1);
}

.quick.show{
  opacity:1;

  pointer-events:auto;

  transform:none;
}

.quick button{
  width:100%;

  display:flex;

  align-items:center;

  gap:9px;

  border:0;

  background:transparent;

  color:var(--text);

  padding:10px;

  border-radius:12px;

  font-size:11px;

  font-weight:700;

  text-align:left;

  transition:.14s ease;
}

.quick button:hover{
  background:var(--soft);
}

.quick-icon{
  width:27px;
  height:27px;

  display:grid;
  place-items:center;

  border-radius:8px;

  background:var(--accent-soft);

  color:var(--accent);
}


/* =========================================================
   MOBILE NAV
========================================================= */

.mobile-nav{
  display:none;
}


/* =========================================================
   IPAD LANDSCAPE / MEDIUM
========================================================= */

@media(max-width:1180px){

  :root{
    --sidebar:215px;
  }

  .content{
    padding:
      18px
      20px
      90px;
  }

  .grid{
    gap:11px;
  }

  .card{
    padding:14px;

    border-radius:17px;
  }

  .hero{
    min-height:190px;
  }

  .side-btn{
    min-height:40px;
    font-size:12px;
  }

}


/* =========================================================
   IPAD PORTRAIT
========================================================= */

@media(min-width:700px) and (max-width:1024px){

  :root{
    --sidebar:178px;
  }

  .sidebar{
    padding:12px 8px;
  }

  .logo{
    padding:
      5px
      6px
      13px;
  }

  .logo img{
    width:33px;
    height:33px;
  }

  .logo-title{
    font-size:13px;
  }

  .logo-sub{
    font-size:8px;
  }

  .side-btn{
    min-height:37px;

    padding:
      7px 7px;

    gap:6px;

    font-size:10px;
  }

  .side-icon{
    width:18px;
    min-width:18px;

    font-size:13px;
  }

  .content{
    padding:
      14px
      12px
      75px;
  }

  .topbar{
    margin-bottom:15px;
  }

  .title{
    font-size:26px;
  }

  .subtitle{
    font-size:10px;
  }

  .grid{
    grid-template-columns:
      repeat(6,minmax(0,1fr));

    gap:9px;
  }

  .c12,
  .c9,
  .c8,
  .c7{
    grid-column:span 6;
  }

  .c6{
    grid-column:span 3;
  }

  .c5,
  .c4,
  .c3{
    grid-column:span 3;
  }

  .card{
    padding:12px;

    border-radius:15px;
  }

  .hero{
    min-height:175px;
  }

  .hero-title{
    font-size:28px;
  }

  .stats{
    gap:6px;
  }

  .stat{
    padding:9px;
  }

  .stat-number{
    font-size:19px;
  }

  .stat-label{
    font-size:8px;
  }

  .item{
    padding:8px;
  }

  .item-title{
    font-size:11px;
  }

  .item-sub{
    font-size:8px;
  }

  .section{
    margin-top:16px;
  }

  .section-title{
    font-size:14px;
  }

  .fab{
    right:18px;
    bottom:18px;

    width:51px;
    height:51px;
  }

  .quick{
    right:18px;
    bottom:79px;
  }

}


/* =========================================================
   PHONE
========================================================= */

@media(max-width:699px){

  body{
    padding-bottom:72px;
  }

  .sidebar{
    display:none;
  }

const STORAGE = "klassenboard_optimized_v1";

  },

  subjects:[],
  teachers:[],

  schedule:[],
  breaks:[],

  homework:[],
  tasks:[],
  events:[],
  grades:[],

  backpack:[],

  notes:[],

  checklistItems:[],

  flashcards:[],

let data = load();

let currentPage = "dashboard";

let modalData = null;

let timerSeconds = 25 * 60;

let timerInterval = null;


/* =========================================================
   LOAD / SAVE
========================================================= */

function load(){

  try{

    const raw =
      localStorage.getItem(STORAGE);

    if(!raw){

      return structuredClone(DEFAULT);

    }

    return merge(
      structuredClone(DEFAULT),
      JSON.parse(raw)
    );

  }catch{

    return structuredClone(DEFAULT);

  }

}


function merge(base,extra){

  for(const key in extra){

    if(
      extra[key] &&
      typeof extra[key] === "object" &&
      !Array.isArray(extra[key]) &&
      typeof base[key] === "object"
    ){

      base[key] =
        merge(base[key],extra[key]);

    }else{

      base[key] = extra[key];

    }

  }

  return base;

}


function save(){

  localStorage.setItem(
    STORAGE,
    JSON.stringify(data)
  );

  updateProfile();

}


/* =========================================================
   HELPERS
========================================================= */

function id(){

  if(window.crypto?.randomUUID){

    return crypto.randomUUID();

  }

  return Date.now().toString(36)
    + Math.random().toString(36).slice(2);

}


function esc(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


const DAYS = [
  "Montag",
  "Dienstag",
  "Mittwoch",
  "Donnerstag",
  "Freitag"
];


function today(){

  const d = new Date();

  return [
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,"0"),
    String(d.getDate()).padStart(2,"0")
  ].join("-");

}


function formatDate(value){

  if(!value){
    return "";
  }

  const d = new Date(value);

  return d.toLocaleDateString(
    "de-DE",
    {
      day:"2-digit",
      month:"2-digit",
      year:"numeric"
    }
  );

}


function subject(id){

  return data.subjects.find(
    x => x.id === id
  );

}


function subjectName(id){

  return subject(id)?.name || "Ohne Fach";

}


function subjectColor(id){

  const colors = [
    "#2563eb",
    "#7c3aed",
    "#059669",
    "#ea580c",
    "#db2777",
    "#0891b2",
    "#65a30d",
    "#dc2626"
  ];

  let total = 0;

  for(const char of String(id || "")){
    total += char.charCodeAt(0);
  }

  return colors[
    total % colors.length
  ];

}

/* =========================================================
   CURRENT LESSON
========================================================= */

function currentLesson(){

  const now =
    new Date();

  const day =
    now.getDay();

  if(day < 1 || day > 5){
    return null;
  }

  const dayName =
    DAYS[day-1];

  const minutes =
    now.getHours()*60 +
    now.getMinutes() +
    now.getSeconds()/60;

  return data.schedule.find(
    lesson => {

      if(
        lesson.day !== dayName ||
        !lesson.from ||
        !lesson.to
      ){
        return false;
      }

      const start =
        timeMinutes(lesson.from);

      const end =
        timeMinutes(lesson.to);

      return (
        minutes >= start &&
        minutes < end
      );

    }
  ) || null;

}


function timeMinutes(value){

  const [h,m] =
    value.split(":").map(Number);

  return h*60+m;

}


function nextLessons(){

  const now =
    new Date();

  const day =
    now.getDay();

  if(day < 1 || day > 5){
    return [];
  }

  const dayName =
    DAYS[day-1];

  const currentMinutes =
    now.getHours()*60 +
    now.getMinutes();

  return data.schedule

    .filter(x =>
      x.day === dayName
    )

    .filter(x =>
      timeMinutes(x.from || "00:00")
      > currentMinutes
    )

    .sort((a,b)=>
      Number(a.period)-Number(b.period)
    )

    .slice(0,4);

}


function todayLessons(){

  const day =
    new Date().getDay();

  if(day < 1 || day > 5){
    return [];
  }

  return data.schedule

    .filter(x =>
      x.day === DAYS[day-1]
    )

    .sort((a,b)=>
      Number(a.period)-Number(b.period)
    );

}


function tomorrowLessons(){

  const day =
    new Date().getDay();

  let target;

  if(day === 5 || day === 6){

    target = 0;

  }else{

    target = day;

  }

  return data.schedule

    .filter(x =>
      x.day === DAYS[target]
    )

    .sort((a,b)=>
      Number(a.period)-Number(b.period)
    );

}

      </section>


      <!-- TASKS -->

      <!-- TODAY -->

/* =========================================================
   GRADES
========================================================= */

function gradeNumber(value){

  const str =
    String(value)
      .trim()
      .replace(",", ".");

  const match =
    str.match(/^([1-6])([+-])?$/);

  if(!match){

    const num =
      parseFloat(str);

    return Number.isNaN(num)
      ? null
      : num;

  }

  let num =
    Number(match[1]);

  if(match[2] === "+"){
    num -= .3;
  }

  if(match[2] === "-"){
    num += .3;
  }

  return num;

}


function overallAverage(){

  if(!data.grades.length){
    return "—";
  }

  const values =
    data.grades
      .map(x=>gradeNumber(x.value))
      .filter(x=>x!==null);

  if(!values.length){
    return "—";
  }

  return (
    values.reduce(
      (a,b)=>a+b,
      0
    ) / values.length
  ).toFixed(2);

}


function renderGrades(){

  data.grades.forEach(grade=>{

    const key =

function startTimer(){

  if(timerInterval){
    return;
  }

  timerInterval =
    setInterval(()=>{

      timerSeconds--;

      if(timerSeconds <= 0){

        timerSeconds = 0;

        clearInterval(
          timerInterval
        );

        timerInterval = null;

      }

      updateTimer();

    },1000);

}


function resetTimer(){

  clearInterval(
    timerInterval
  );

  timerInterval = null;

  timerSeconds =
    25 * 60;

  updateTimer();

}


function updateTimer(){

  const element =
    document.getElementById(
      "timer"
    );

  if(!element){
    return;
  }

  const minutes =
    Math.floor(
      timerSeconds / 60
    );

  const seconds =
    timerSeconds % 60;

  element.textContent =
    `${String(minutes).padStart(2,"0")}:${String(seconds).padStart(2,"0")}`;

}

                      onclick="deleteChecklist(
                        '${list.id}'
                      )">
                      Löschen
                    </button>

              `;

            })
            .join("")

            ||

        }

function toggleChecklist(id){

  const item =
    data.checklistItems.find(
      x=>x.id===id
    );

  if(item){

    item.done = !item.done;

    save();

    render();

  }

}


function deleteChecklist(id){

  if(!confirm(
    "Checkliste wirklich löschen?"
  )){
    return;
  }

  data.checklists =
    data.checklists.filter(
      x=>x.id!==id
    );

  data.checklistItems =
    data.checklistItems.filter(
      x=>x.listId!==id
    );

  save();

  render();

}

function openModal(type,preset={}){

  modalData = {

  };

  document
    .getElementById(
      "modalBackdrop"
    )
    .classList.add("show");

  document
    .getElementById(
      "quick"
    )
    .classList.remove("show");

  document

    )

  renderModal();

function closeModal(){

  document
    .getElementById(

    .getElementById(id)

}

function submitSchedule(){

  const day =
    value("formDay");

  const period =
    Number(
      value("formPeriod")
    );

  const subjectId =
    value("formSubject");

  if(!subjectId){

    alert(
      "Bitte zuerst ein Fach auswählen."
    );

    return;

  }


  const edit =
    modalData.preset.edit;


  const duplicate =
    data.schedule.find(
      x =>
        x.day === day &&
        Number(x.period) === period &&
        x.id !== edit?.id
    );


  if(duplicate){

    if(!confirm(
      "Für diesen Tag und diese Stunde gibt es bereits einen Eintrag. Ersetzen?"
    )){

      return;

    }

    data.schedule =
      data.schedule.filter(
        x=>x.id!==duplicate.id
      );

  }


  const lesson = {

    id:
      edit?.id || id(),

    day,

    period,

    subjectId,

    from:
      value("formFrom"),

    to:
      value("formTo"),

    room:
      value("formRoom"),

    teacher:
      value("formTeacher")

  };


  const index =
    data.schedule.findIndex(
      x=>x.id===lesson.id
    );


  if(index >= 0){

    data.schedule[index] =
      lesson;

  }else{

    data.schedule.push(
      lesson
    );

  }


  save();

  closeModal();

  render();

}

/* =========================================================
   SEARCH
========================================================= */

function searchEverything(){

  const query =
    prompt(
      "Was möchtest du suchen?"
    );

  if(!query){
    return;
  }

  const q =
    query.toLowerCase();

  const results = [];


  data.subjects.forEach(x=>{

    if(
      x.name.toLowerCase()
        .includes(q)
    ){

      results.push(
        `Fach: ${x.name}`
      );

    }

  });


  data.homework.forEach(x=>{

    if(
      x.title.toLowerCase()
        .includes(q)
    ){

      results.push(
        `Hausaufgabe: ${x.title}`
      );

    }

  });


  data.tasks.forEach(x=>{

    if(
      x.title.toLowerCase()
        .includes(q)
    ){

      results.push(
        `Aufgabe: ${x.title}`
      );

    }

  });


  data.notes.forEach(x=>{

    if(
      x.title.toLowerCase()
        .includes(q) ||
      x.text.toLowerCase()
        .includes(q)
    ){

      results.push(
        `Notiz: ${x.title}`
      );

    }

  });


  data.events.forEach(x=>{

    if(
      x.title.toLowerCase()
        .includes(q)
    ){

      results.push(
        `Termin: ${x.title}`
      );

    }

  });


  alert(
    results.length
      ? results.slice(0,12).join("\n")
      : "Nichts gefunden."
  );

}


/* =========================================================
   IMPORT / EXPORT
========================================================= */

function exportData(){

  const blob =
    new Blob(
      [
        JSON.stringify(
          data,
          null,
          2
        )
      ],
      {
        type:
          "application/json"
      }
    );

  const url =
    URL.createObjectURL(blob);

  const link =
    document.createElement("a");

  link.href = url;

  link.download =
    "KlassenBoard-Backup.json";

  link.click();

  URL.revokeObjectURL(url);

}


function importData(){

  const input =
    document.createElement("input");

  input.type = "file";

  input.accept =
    ".json,application/json";


  input.onchange =
    event=>{

      const file =
        event.target.files[0];

      if(!file){
        return;
      }

      const reader =
        new FileReader();


      reader.onload =
        () => {

          try{

            data =
              merge(
                structuredClone(DEFAULT),
                JSON.parse(
                  reader.result
                )
              );

            save();

            applyTheme();

            updateProfile();

            render();

            alert(
              "Import erfolgreich."
            );

          }catch{

            alert(
              "Die Datei ist ungültig."
            );

          }

        };


      reader.readAsText(file);

    };


  input.click();

}


function resetData(){

  if(!confirm(
    "Wirklich ALLE KlassenBoard-Daten löschen?"
  )){
    return;
  }

  localStorage.removeItem(
    STORAGE
  );

  data =
    structuredClone(DEFAULT);

  applyTheme();

  updateProfile();

  navigate(
    "dashboard"
  );

}


/* =========================================================
   LIVE CURRENT LESSON
========================================================= */

function updateCurrentProgress(){

  const current =
    currentLesson();

  if(!current){
    return;
  }

  const now =
    new Date();

  const currentMinutes =
    now.getHours()*60 +
    now.getMinutes() +
    now.getSeconds()/60;

  const start =
    timeMinutes(
      current.from
    );

  const end =
    timeMinutes(
      current.to
    );

  const percentage =
    Math.max(
      0,
      Math.min(
        100,
        (
          (currentMinutes-start) /
          (end-start)
        ) * 100
      )
    );


  const progress =
    document.getElementById(
      "currentProgress"
    );

  if(progress){

    progress.style.width =
      `${percentage}%`;

  }


  const remaining =
    Math.max(
      0,
      Math.ceil(
        end-currentMinutes
      )
    );


  const text =
    remaining >= 60
      ? `${Math.floor(
          remaining/60
        )}h ${remaining%60}m`
      : `${remaining} min`;


  const remainingElement =
    document.getElementById(
      "currentRemaining"
    );

  if(remainingElement){

    remainingElement.textContent =
      `${text} übrig`;

  }

}


setInterval(
  updateCurrentProgress,
  1000
);
