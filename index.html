<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0f19">
<title>KlassenBoard</title>

<script src="https://cdn.tailwindcss.com"></script>

<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: {
        sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif']
      }
    }
  }
}
</script>

<style>
* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Inter, ui-sans-serif, system-ui, sans-serif;
  background:
    radial-gradient(circle at 10% 0%, rgba(80,110,255,.14), transparent 28%),
    radial-gradient(circle at 90% 10%, rgba(0,200,255,.08), transparent 25%),
    #080b12;
  color: #f5f7fb;
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  -webkit-tap-highlight-color: transparent;
}

.glass {
  background: rgba(17, 22, 34, .78);
  border: 1px solid rgba(255,255,255,.08);
  box-shadow:
    0 15px 45px rgba(0,0,0,.18),
    inset 0 1px 0 rgba(255,255,255,.025);
  backdrop-filter: blur(22px);
}

.card {
  border-radius: 22px;
}

.input {
  width: 100%;
  border: 1px solid rgba(255,255,255,.09);
  background: rgba(255,255,255,.045);
  color: white;
  border-radius: 14px;
  padding: 12px 14px;
  outline: none;
  transition: .2s;
}

.input:focus {
  border-color: rgba(100,140,255,.7);
  background: rgba(255,255,255,.065);
  box-shadow: 0 0 0 3px rgba(80,110,255,.12);
}

.input option {
  background: #111622;
}

textarea.input {
  min-height: 100px;
  resize: vertical;
}

.btn {
  border-radius: 13px;
  padding: 10px 14px;
  font-weight: 600;
  transition: .18s;
  cursor: pointer;
}

.btn:hover {
  transform: translateY(-1px);
}

.btn:active {
  transform: scale(.98);
}

.btn-primary {
  background: #5875ff;
  color: white;
}

.btn-secondary {
  background: rgba(255,255,255,.07);
  border: 1px solid rgba(255,255,255,.08);
}

.btn-danger {
  background: rgba(255,70,80,.12);
  color: #ff8b92;
  border: 1px solid rgba(255,70,80,.15);
}

.nav-btn {
  width: 100%;
  text-align: left;
  padding: 12px 14px;
  border-radius: 14px;
  color: #aeb6c8;
  transition: .18s;
}

.nav-btn:hover {
  background: rgba(255,255,255,.055);
  color: white;
}

.nav-btn.active {
  background: rgba(88,117,255,.16);
  color: white;
  border: 1px solid rgba(88,117,255,.22);
}

.sidebar {
  width: 250px;
  flex-shrink: 0;
}

.page {
  width: min(1500px, calc(100vw - 40px));
  margin: auto;
}

.grid-auto {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 16px;
}

.grid-wide {
  display: grid;
  grid-template-columns: minmax(0, 1.5fr) minmax(280px, 1fr);
  gap: 18px;
}

.schedule-grid {
  display: grid;
  grid-template-columns: 110px repeat(5, minmax(150px, 1fr));
  gap: 8px;
  min-width: 850px;
}

.schedule-cell {
  min-height: 74px;
  border-radius: 14px;
  background: rgba(255,255,255,.035);
  border: 1px solid rgba(255,255,255,.06);
  padding: 10px;
}

.modal-bg {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(0,0,0,.65);
  backdrop-filter: blur(10px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.modal {
  width: min(650px, 100%);
  max-height: min(90vh, 900px);
  overflow-y: auto;
  border-radius: 24px;
  padding: 22px;
}

.fab {
  position: fixed;
  right: max(24px, env(safe-area-inset-right));
  bottom: max(24px, env(safe-area-inset-bottom));
  width: 62px;
  height: 62px;
  border-radius: 50%;
  background: #5875ff;
  color: white;
  font-size: 30px;
  line-height: 1;
  box-shadow: 0 15px 40px rgba(65,90,255,.4);
  z-index: 80;
  transition: .2s;
}

.fab:hover {
  transform: scale(1.06) rotate(90deg);
}

.fab-menu {
  position: fixed;
  right: max(24px, env(safe-area-inset-right));
  bottom: calc(max(24px, env(safe-area-inset-bottom)) + 75px);
  width: min(330px, calc(100vw - 32px));
  z-index: 79;
}

.fab-item {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 13px;
  border-radius: 15px;
  background: rgba(20,25,38,.94);
  border: 1px solid rgba(255,255,255,.08);
  margin-top: 7px;
  color: white;
  text-align: left;
}

.progress {
  height: 8px;
  border-radius: 999px;
  overflow: hidden;
  background: rgba(255,255,255,.08);
}

.progress > div {
  height: 100%;
  border-radius: inherit;
  background: #5875ff;
  transition: width .5s linear;
}

.badge {
  display: inline-flex;
  align-items: center;
  border-radius: 999px;
  padding: 4px 9px;
  font-size: 12px;
  background: rgba(255,255,255,.07);
  color: #b8c0d2;
}

.empty {
  padding: 35px 15px;
  text-align: center;
  color: #778198;
}

::-webkit-scrollbar {
  width: 9px;
  height: 9px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,.12);
  border-radius: 999px;
}

@media(max-width: 1000px) {
  .sidebar {
    width: 210px;
  }

  .grid-wide {
    grid-template-columns: 1fr;
  }
}

@media(max-width: 760px) {
  .sidebar {
    display: none;
  }

  .page {
    width: calc(100vw - 24px);
  }

  .mobile-nav {
    display: flex !important;
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 50;
  }

  .grid-auto {
    grid-template-columns: repeat(2, minmax(0,1fr));
  }

  .modal {
    padding: 17px;
    border-radius: 20px;
  }
}

@media(max-width: 480px) {
  .grid-auto {
    grid-template-columns: 1fr;
  }

  .page {
    width: calc(100vw - 16px);
  }

  .fab {
    width: 58px;
    height: 58px;
    right: 16px;
    bottom: 16px;
  }

  .fab-menu {
    right: 16px;
    bottom: 82px;
  }
}

.mobile-nav {
  display: none;
}

.light {
  background: #eef2f8;
  color: #101522;
}

.light .glass {
  background: rgba(255,255,255,.82);
  border-color: rgba(0,0,0,.07);
  box-shadow: 0 15px 40px rgba(0,0,0,.07);
}

.light .input {
  background: rgba(0,0,0,.035);
  color: #111827;
  border-color: rgba(0,0,0,.08);
}

.light .nav-btn {
  color: #657084;
}

.light .nav-btn.active {
  color: #172033;
}

.light .btn-secondary {
  background: rgba(0,0,0,.045);
  border-color: rgba(0,0,0,.07);
}

.light .schedule-cell {
  background: rgba(0,0,0,.025);
  border-color: rgba(0,0,0,.06);
}

.light .fab-item {
  background: rgba(255,255,255,.96);
  color: #111827;
}
</style>
</head>

<body>

<div id="app"></div>

<script>
/* =========================================================
   KLASSENBOARD SCHOOL OS
   Alles lokal im Browser
========================================================= */

const STORAGE_KEY = "klassenboard_v3";

const defaultData = {
  settings: {
    name: "",
    className: "Meine Klasse",
    theme: "dark"
  },

  subjects: [
    {id:"mathe", name:"Mathematik", teacher:"", room:"", color:"#5875ff"},
    {id:"deutsch", name:"Deutsch", teacher:"", room:"", color:"#8b5cf6"},
    {id:"englisch", name:"Englisch", teacher:"", room:"", color:"#06b6d4"}
  ],

  teachers: [],

  schedule: [],
  breaks: [],
  homework: [],
  tasks: [],
  notes: [],
  events: [],
  grades: [],
  backpack: [],
  checklists: [],
  checklistItems: [],
  flashcards: [],
  goals: [],
  substitutions: [],
  reminders: [],

  deleted: []
};

let data = loadData();
let currentPage = "dashboard";
let modal = null;
let searchTerm = "";
let fabOpen = false;
let selectedCalendarDate = new Date().toISOString().slice(0,10);

function uid(prefix="id") {
  return prefix + "_" + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return structuredClone(defaultData);

    const saved = JSON.parse(raw);

    return {
      ...structuredClone(defaultData),
      ...saved,
      settings: {...defaultData.settings, ...(saved.settings || {})}
    };
  } catch {
    return structuredClone(defaultData);
  }
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  render();
}

function esc(value="") {
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function todayISO() {
  return new Date().toISOString().slice(0,10);
}

function formatDate(date) {
  if (!date) return "";
  return new Date(date + "T12:00:00").toLocaleDateString("de-DE", {
    day:"2-digit",
    month:"2-digit",
    year:"numeric"
  });
}

function dayName(index) {
  return ["Montag","Dienstag","Mittwoch","Donnerstag","Freitag"][index] || "";
}

function weekdayIndex(date = new Date()) {
  let n = date.getDay();
  return n === 0 ? 6 : n - 1;
}

function timeToMinutes(time) {
  if (!time) return 0;
  const [h,m] = time.split(":").map(Number);
  return h * 60 + m;
}

function nowMinutes() {
  const d = new Date();
  return d.getHours()*60 + d.getMinutes() + d.getSeconds()/60;
}

function formatRemaining(minutes) {
  if (minutes <= 0) return "0 Min.";
  const m = Math.floor(minutes);
  if (m < 60) return `${m} Min.`;
  const h = Math.floor(m/60);
  const rest = m % 60;
  return `${h} Std. ${rest} Min.`;
}

function subjectName(id) {
  return data.subjects.find(s => s.id === id)?.name || id || "Ohne Fach";
}

function subjectColor(id) {
  return data.subjects.find(s => s.id === id)?.color || "#5875ff";
}

/* =========================================================
   CURRENT LESSON
========================================================= */

function currentStatus() {
  const day = weekdayIndex();
  const now = nowMinutes();

  if (day > 4) {
    return {type:"free", title:"Wochenende", subtitle:"Kein Unterricht heute"};
  }

  const lessons = data.schedule
    .filter(x => Number(x.day) === day)
    .sort((a,b) => timeToMinutes(a.from)-timeToMinutes(b.from));

  const breaks = data.breaks
    .filter(x => Number(x.day) === day)
    .sort((a,b) => timeToMinutes(a.from)-timeToMinutes(b.from));

  for (const b of breaks) {
    if (now >= timeToMinutes(b.from) && now < timeToMinutes(b.to)) {
      return {
        type:"break",
        title:b.name || "Pause",
        subtitle:`Bis ${b.to}`,
        item:b,
        remaining:timeToMinutes(b.to)-now
      };
    }
  }

  for (const l of lessons) {
    const from = timeToMinutes(l.from);
    const to = timeToMinutes(l.to);

    if (now >= from && now < to) {
      return {
        type:"lesson",
        title:subjectName(l.subject),
        subtitle:`Bis ${l.to}`,
        item:l,
        remaining:to-now,
        total:to-from,
        elapsed:now-from
      };
    }
  }

  const next = lessons.find(x => timeToMinutes(x.from) > now);

  if (next) {
    return {
      type:"next",
      title:`Als Nächstes: ${subjectName(next.subject)}`,
      subtitle:`Um ${next.from}`,
      item:next,
      remaining:timeToMinutes(next.from)-now
    };
  }

  return {
    type:"done",
    title:"Schule vorbei",
    subtitle:"Für heute ist nichts mehr eingetragen."
  };
}

/* =========================================================
   LAYOUT
========================================================= */

function render() {
  document.body.className = data.settings.theme === "light" ? "light" : "";

  document.getElementById("app").innerHTML = `
    <div class="min-h-screen flex">

      <aside class="sidebar glass min-h-screen p-4 hidden md:block">
        ${sidebar()}
      </aside>

      <main class="flex-1 min-w-0">
        <header class="topbar glass m-2 md:m-4 rounded-2xl">
          <div class="px-4 md:px-6 py-4 flex items-center gap-3">
            <button class="md:hidden btn btn-secondary" onclick="toggleMobileNav()">☰</button>

            <div class="flex-1 min-w-0">
              <div class="text-lg font-bold truncate">KlassenBoard</div>
              <div class="text-xs text-gray-400 truncate">
                ${esc(data.settings.className)}
              </div>
            </div>

            <div class="hidden sm:flex relative w-56">
              <input
                class="input"
                placeholder="Suchen..."
                value="${esc(searchTerm)}"
                oninput="globalSearch(this.value)"
              >
            </div>

            <button class="btn btn-secondary" onclick="openSettings()">⚙️</button>
          </div>
        </header>

        <div id="mobileNav" class="mobile-nav glass m-2 rounded-2xl p-2 gap-1 overflow-x-auto">
          ${mobileNavigation()}
        </div>

        <div class="page py-3 md:py-5 pb-28">
          ${pageContent()}
        </div>
      </main>
    </div>

    ${fab()}
    ${modal ? renderModal() : ""}
  `;

  if (modal) {
    setTimeout(() => {
      const first = document.querySelector("#modalContent input, #modalContent textarea, #modalContent select");
      if (first) first.focus();
    }, 50);
  }
}

function sidebar() {
  return `
    <div class="px-3 pt-3 pb-5">
      <div class="text-2xl font-black tracking-tight">KlassenBoard</div>
      <div class="text-xs text-gray-500 mt-1">School OS</div>
    </div>

    <nav class="space-y-1">
      ${nav("dashboard","⌂","Dashboard")}
      ${nav("today","◷","Jetzt")}
      ${nav("schedule","▦","Stundenplan")}
      ${nav("homework","✓","Aufgaben")}
      ${nav("backpack","▣","Mitnehmen")}
      ${nav("calendar","□","Kalender")}
      ${nav("grades","◇","Noten")}
      ${nav("learning","✦","Lernen")}
      ${nav("notes","✎","Notizen")}
      ${nav("checklists","☑","Checklisten")}
      ${nav("subjects","●","Fächer")}
      ${nav("teachers","♙","Lehrer")}
      ${nav("substitutions","↻","Vertretung")}
    </nav>

    <div class="mt-8 pt-4 border-t border-white/5">
      <button class="nav-btn" onclick="openSettings()">⚙️ Einstellungen</button>
      <button class="nav-btn" onclick="exportData()">💾 Backup exportieren</button>
      <button class="nav-btn" onclick="openImport()">📥 Backup importieren</button>
    </div>
  `;
}

function nav(id, icon, text) {
  return `
    <button class="nav-btn ${currentPage===id ? "active":""}"
      onclick="navigate('${id}')">
      <span class="inline-block w-7">${icon}</span>${text}
    </button>
  `;
}

function mobileNavigation() {
  return [
    ["dashboard","⌂"],
    ["today","◷"],
    ["schedule","▦"],
    ["homework","✓"],
    ["backpack","▣"],
    ["calendar","□"],
    ["grades","◇"],
    ["learning","✦"],
    ["notes","✎"]
  ].map(x => `
    <button
      onclick="navigate('${x[0]}')"
      class="px-4 py-2 rounded-xl whitespace-nowrap ${currentPage===x[0]?"bg-white/10":"text-gray-400"}">
      ${x[1]}
    </button>
  `).join("");
}

function navigate(page) {
  currentPage = page;
  fabOpen = false;
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

/* =========================================================
   PAGES
========================================================= */

function pageContent() {
  switch(currentPage) {
    case "today": return todayPage();
    case "schedule": return schedulePage();
    case "homework": return homeworkPage();
    case "backpack": return backpackPage();
    case "calendar": return calendarPage();
    case "grades": return gradesPage();
    case "learning": return learningPage();
    case "notes": return notesPage();
    case "checklists": return checklistsPage();
    case "subjects": return subjectsPage();
    case "teachers": return teachersPage();
    case "substitutions": return substitutionsPage();
    default: return dashboardPage();
  }
}

/* =========================================================
   DASHBOARD
========================================================= */

function dashboardPage() {
  const status = currentStatus();

  const openTasks = data.tasks.filter(x=>!x.done).length +
                    data.homework.filter(x=>!x.done).length;

  const avg = gradeAverage();

  return `
    <section class="mb-6">
      <div class="text-sm text-gray-400">${greeting()}</div>
      <h1 class="text-3xl md:text-5xl font-black mt-1">
        ${esc(data.settings.name ? data.settings.name : "Willkommen")}
      </h1>
      <p class="text-gray-500 mt-2">
        ${new Date().toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"})}
      </p>
    </section>

    <div class="grid-auto mb-5">
      ${statCard("◷","Jetzt",status.title,status.type==="lesson" ? formatRemaining(status.remaining) : "")}
      ${statCard("✓","Offene Aufgaben",openTasks,"")}
      ${statCard("◇","Notendurchschnitt",avg ?? "—","")}
      ${statCard("▣","Mitnehmen",data.backpack.filter(x=>x.active!==false).length,"")}
    </div>

    <div class="grid-wide">
      <div class="space-y-4">
        ${currentCard(status)}
        ${nextLessonsCard()}
      </div>

      <div class="space-y-4">
        ${todayTasksCard()}
        ${tomorrowCard()}
      </div>
    </div>
  `;
}

function statCard(icon,label,value,small) {
  return `
    <div class="glass card p-5">
      <div class="flex items-center justify-between">
        <span class="text-gray-400">${icon} ${label}</span>
        ${small ? `<span class="badge">${small}</span>` : ""}
      </div>
      <div class="text-2xl font-black mt-4 truncate">${esc(value)}</div>
    </div>
  `;
}

function currentCard(status) {
  let color = status.type==="lesson" ? subjectColor(status.item.subject) : "#5875ff";

  if (status.type === "lesson") {
    const percent = Math.max(0,Math.min(100,(status.elapsed/status.total)*100));

    return `
      <div class="glass card p-5 md:p-7">
        <div class="flex justify-between gap-4">
          <div>
            <div class="text-sm text-gray-400">GERADE</div>
            <div class="text-3xl font-black mt-1">${esc(status.title)}</div>
            <div class="text-gray-400 mt-2">
              ${esc(status.item.room || "Kein Raum")}
              · ${status.item.from} – ${status.item.to}
            </div>
          </div>

          <div class="text-right">
            <div class="text-sm text-gray-400">NOCH</div>
            <div id="liveRemaining" class="text-2xl font-black mt-1">
              ${formatRemaining(status.remaining)}
            </div>
          </div>
        </div>

        <div class="progress mt-6">
          <div id="liveProgress" style="width:${percent}%;background:${color}"></div>
        </div>

        <div class="flex justify-between text-xs text-gray-500 mt-2">
          <span>${status.item.from}</span>
          <span>${status.item.to}</span>
        </div>
      </div>
    `;
  }

  return `
    <div class="glass card p-6">
      <div class="text-sm text-gray-400">AKTUELL</div>
      <div class="text-3xl font-black mt-1">${esc(status.title)}</div>
      <div class="text-gray-400 mt-2">${esc(status.subtitle)}</div>
    </div>
  `;
}

function nextLessonsCard() {
  const day = weekdayIndex();
  const now = nowMinutes();

  const next = data.schedule
    .filter(x=>Number(x.day)===day && timeToMinutes(x.from)>now)
    .sort((a,b)=>timeToMinutes(a.from)-timeToMinutes(b.from))
    .slice(0,4);

  return `
    <div class="glass card p-5">
      <div class="flex justify-between mb-4">
        <div>
          <div class="text-sm text-gray-400">WEITER</div>
          <h2 class="text-xl font-bold">Nächste Stunden</h2>
        </div>
        <button class="btn btn-secondary" onclick="navigate('schedule')">Alle</button>
      </div>

      ${
        next.length
        ? next.map(lessonRow).join("")
        : `<div class="empty">Keine weiteren Stunden heute.</div>`
      }
    </div>
  `;
}

function lessonRow(l) {
  return `
    <div class="flex items-center gap-3 p-3 rounded-xl bg-white/[.035] mb-2">
      <div class="w-1 h-11 rounded-full" style="background:${subjectColor(l.subject)}"></div>
      <div class="flex-1 min-w-0">
        <div class="font-semibold truncate">${esc(subjectName(l.subject))}</div>
        <div class="text-xs text-gray-500">
          ${l.from} – ${l.to}${l.room ? ` · ${esc(l.room)}`:""}
        </div>
      </div>
    </div>
  `;
}

function todayTasksCard() {
  const tasks = [
    ...data.homework.map(x=>({...x,_type:"Hausaufgabe"})),
    ...data.tasks.map(x=>({...x,_type:"Aufgabe"}))
  ].filter(x=>!x.done).slice(0,5);

  return `
    <div class="glass card p-5">
      <div class="flex justify-between mb-4">
        <h2 class="text-xl font-bold">Heute erledigen</h2>
        <button class="btn btn-secondary" onclick="navigate('homework')">Alle</button>
      </div>
      ${tasks.length ? tasks.map(taskMini).join("") : `<div class="empty">Alles erledigt 🎉</div>`}
    </div>
  `;
}

function taskMini(t) {
  return `
    <div class="flex gap-3 items-center p-3 rounded-xl bg-white/[.035] mb-2">
      <button onclick="toggleTask('${t.id}','${t._type}')"

function tomorrowCard() {
  const tomorrow = new Date();

  if(day > 4) {
    return `

        <div class="text-sm text-gray-400">MORGEN</div>
        <div class="text-xl font-bold mt-1">Wochenende</div>
      </div>

  }

  const lessons = data.schedule
    .filter(x=>Number(x.day)===day)
    .sort((a,b)=>timeToMinutes(a.from)-timeToMinutes(b.from))
    .slice(0,4);

  return `
    <div class="glass card p-5">
      <div class="text-sm text-gray-400">MORGEN</div>
      <div class="text-xl font-bold mt-1">${dayName(day)}</div>

function greeting() {
  const h = new Date().getHours();
  if(h < 11) return "Guten Morgen";
  if(h < 17) return "Guten Tag";
  return "Guten Abend";
}

  return `

function remainingLessonsCard() {
  const day=weekdayIndex();
  const now=nowMinutes();
  const count=data.schedule.filter(x=>Number(x.day)===day && timeToMinutes(x.to)>now).length;

  return `
    <div class="glass card p-5">
      <div class="text-gray-400 text-sm">NOCH</div>
      <div class="text-3xl font-black mt-2">${count}</div>
      <div class="text-gray-500">Stunden heute</div>
    </div>
  `;
}

function schoolEndCard() {
  const day=weekdayIndex();
  const lessons=data.schedule
    .filter(x=>Number(x.day)===day)
    .sort((a,b)=>timeToMinutes(b.to)-timeToMinutes(a.to));

  if(!lessons.length) {
    return `<div class="glass card p-5"><div class="text-gray-400">Schulschluss</div><div class="text-xl font-bold mt-2">—</div></div>`;
  }

  const end=lessons[0].to;
  const remaining=timeToMinutes(end)-nowMinutes();

  return `
    <div class="glass card p-5">
      <div class="text-gray-400 text-sm">SCHULSCHLUSS</div>
      <div class="text-3xl font-black mt-2">${remaining>0 ? formatRemaining(remaining) : "Fertig"}</div>
      <div class="text-gray-500">${end} Uhr</div>
    </div>
  `;
}

function nextBreakCard() {
  const day=weekdayIndex();
  const now=nowMinutes();

  const b=data.breaks
    .filter(x=>Number(x.day)===day && timeToMinutes(x.from)>now)
    .sort((a,b)=>timeToMinutes(a.from)-timeToMinutes(b.from))[0];

  return `
    <div class="glass card p-5">
      <div class="text-gray-400 text-sm">NÄCHSTE PAUSE</div>
      ${
        b
        ? `<div class="text-xl font-bold mt-2">${esc(b.name)}</div>
           <div class="text-gray-500">${b.from} – ${b.to}</div>`
        : `<div class="text-xl font-bold mt-2">Keine</div>`
      }
    </div>
  `;
}

function todayTimeline() {
  const day=weekdayIndex();

  const entries = [
    ...data.schedule.filter(x=>Number(x.day)===day).map(x=>({...x,type:"lesson"})),
    ...data.breaks.filter(x=>Number(x.day)===day).map(x=>({...x,type:"break"}))
  ].sort((a,b)=>timeToMinutes(a.from)-timeToMinutes(b.from));

  if(!entries.length) return `<div class="empty">Noch nichts eingetragen.</div>`;

  return entries.map(x=>`
    <div class="flex gap-4 items-center py-3 border-b border-white/5 last:border-0">
      <div class="w-20 text-sm text-gray-500">${x.from}</div>
      <div class="w-1 h-10 rounded-full" style="background:${x.type==="lesson"?subjectColor(x.subject):"#64748b"}"></div>
      <div class="flex-1">
        <div class="font-semibold">${esc(x.type==="lesson"?subjectName(x.subject):x.name)}</div>
        <div class="text-xs text-gray-500">${x.from} – ${x.to}</div>
      </div>
    </div>
  `).join("");
}

function scheduleRows() {
  const max=12;
  let html="";

  for(let period=1;period<=max;period++) {
    html += `<div class="schedule-cell text-gray-500">${period}. Stunde</div>`;

    for(let day=0;day<5;day++) {
      const l=data.schedule.find(x=>Number(x.day)===day && Number(x.period)===period);

      html += `
        <div class="schedule-cell relative">
          ${
            l
            ? `<button onclick="editItem('schedule','${l.id}')" class="w-full text-left">
                 <div class="font-bold">${esc(subjectName(l.subject))}</div>
                 <div class="text-xs text-gray-500 mt-1">
                   ${l.from}–${l.to}${l.room ? ` · ${esc(l.room)}`:""}
                 </div>
               </button>`
            : `<button onclick="openScheduleFor(${day},${period})" class="text-gray-600 hover:text-white w-full h-full">＋</button>`
          }
        </div>
      `;
    }
  }

  return html;
}

function openScheduleFor(day,period) {
  modal={type:"schedule",preset:{day,period}};
  render();
}

function breakRow(b) {
  return `
    <div class="flex items-center gap-3 p-3 rounded-xl bg-white/[.035] mb-2">

/* =========================================================
   CALENDAR
========================================================= */

function calendarPage() {
  const date=new Date(selectedCalendarDate+"T12:00:00");
  const month=date.getMonth();
  const year=date.getFullYear();

  const first=new Date(year,month,1);
  const last=new Date(year,month+1,0);

  let start=first.getDay();
  start=start===0?6:start-1;

  let days=[];

  for(let i=0;i<start;i++) days.push(null);
  for(let i=1;i<=last.getDate();i++) days.push(i);

  return `
    <section class="mb-6 flex justify-between flex-wrap gap-3">
      <div>
        <div class="text-sm text-gray-400">PLANUNG</div>
        <h1 class="text-3xl md:text-4xl font-black">Kalender</h1>
      </div>
      <button class="btn btn-primary" onclick="openModal('event')">＋ Termin</button>
    </section>

    <div class="glass card p-5">
      <div class="flex justify-between items-center mb-5">
        <button class="btn btn-secondary" onclick="changeMonth(-1)">←</button>
        <h2 class="text-xl font-bold">
          ${date.toLocaleDateString("de-DE",{month:"long",year:"numeric"})}
        </h2>
        <button class="btn btn-secondary" onclick="changeMonth(1)">→</button>
      </div>

      <div class="grid grid-cols-7 gap-2 text-center text-xs text-gray-500 mb-2">
        ${["Mo","Di","Mi","Do","Fr","Sa","So"].map(x=>`<div>${x}</div>`).join("")}
      </div>

      <div class="grid grid-cols-7 gap-2">
        ${days.map(day=>calendarDay(day,month,year)).join("")}
      </div>
    </div>

    <div class="glass card p-5 mt-5">
      <div class="flex justify-between mb-4">
        <h2 class="text-xl font-bold">Termine</h2>
        <button class="btn btn-secondary" onclick="openModal('event')">＋</button>
      </div>
      ${
        data.events.length
        ? data.events.sort((a,b)=>a.date.localeCompare(b.date)).map(eventRow).join("")
        : `<div class="empty">Keine Termine.</div>`
      }
    </div>
  `;
}

function calendarDay(day,month,year) {
  if(!day) return `<div></div>`;

  const iso=new Date(year,month,day).toISOString().slice(0,10);
  const events=data.events.filter(x=>x.date===iso);

  return `
    <button onclick="selectCalendarDate('${iso}')"
      class="min-h-16 md:min-h-20 rounded-xl p-2 text-left border
      ${iso===selectedCalendarDate?"border-blue-400 bg-blue-500/10":"border-white/5 bg-white/[.025]"}">
      <div class="font-semibold">${day}</div>
      ${
        events.slice(0,2).map(e=>`
          <div class="text-[10px] truncate text-blue-300 mt-1">${esc(e.title)}</div>
        `).join("")
      }
    </button>
  `;
}

function changeMonth(delta) {
  const d=new Date(selectedCalendarDate+"T12:00:00");
  d.setMonth(d.getMonth()+delta);
  selectedCalendarDate=d.toISOString().slice(0,10);
  render();
}

function selectCalendarDate(iso) {
  selectedCalendarDate=iso;
  openModal("event");
}

   GRADES
========================================================= */

function gradeAverage() {
  if(!data.grades.length) return null;

  const values=data.grades
    .map(x=>Number(x.grade))
    .filter(x=>Number.isFinite(x));

  if(!values.length) return null;

  return (values.reduce((a,b)=>a+b,0)/values.length).toFixed(2);
}

function subjectAverage(subject) {
  const g=data.grades.filter(x=>x.subject===subject);
  if(!g.length) return null;

  return (g.reduce((a,b)=>a+Number(b.grade),0)/g.length).toFixed(2);
}

function startStudyTimer() {
  let seconds=25*60;

  modal={
    type:"timer",
    seconds
  };

  render();

  const interval=setInterval(()=>{
    if(!modal || modal.type!=="timer") {
      clearInterval(interval);
      return;
    }

    modal.seconds--;

    if(modal.seconds<=0) {
      clearInterval(interval);
      modal=null;
      alert("Lernzeit beendet!");
      render();
      return;
    }

    const el=document.getElementById("studyTimer");
    if(el) el.textContent=formatSeconds(modal.seconds);
  },1000);
}

function formatSeconds(s) {
  const m=Math.floor(s/60);
  const sec=s%60;
  return `${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
}

/* =========================================================
   FORM SUBMITS
========================================================= */

function formData(e) {
  e.preventDefault();
  return Object.fromEntries(new FormData(e.target).entries());
}

function submitSchedule(e) {
  const f=formData(e);

  if(timeToMinutes(f.to)<=timeToMinutes(f.from)) {
    alert("Die Bis-Zeit muss nach der Von-Zeit liegen.");
    return;
  }

  data.schedule.push({
    id:uid("lesson"),
    day:Number(f.day),
    period:Number(f.period),
    subject:f.subject,
    room:f.room,
    from:f.from,
    to:f.to,
    teacher:f.teacher,
    repeat:f.repeat
  });

  save();
  modal=null;
  render();
}

function submitBreak(e) {
  const f=formData(e);

  if(timeToMinutes(f.to)<=timeToMinutes(f.from)) {
    alert("Die Bis-Zeit muss nach der Von-Zeit liegen.");
    return;
  }

  data.breaks.push({
    id:uid("break"),

/* Inject settings into modal */
const originalModalContent = modalContent;

};

/* =========================================================
   DELETE / EDIT
========================================================= */

function deleteItem(type,id) {
  const map={
    schedule:"schedule",
    break:"breaks",
    homework:"homework",
    task:"tasks",
    backpack:"backpack",
    event:"events",
    note:"notes",
    grade:"grades",
    flashcard:"flashcards",
    goal:"goals",
    subject:"subjects",
    teacher:"teachers",
    substitution:"substitutions"
  };

  const key=map[type];
  if(!key) return;

  const item=data[key].find(x=>x.id===id);

  if(item) {
    data.deleted.push({
      type,
      item,
      deletedAt:Date.now()
    });
  }

  data[key]=data[key].filter(x=>x.id!==id);

  save();
}

function editItem(type,id) {
  if(type!=="schedule") return;

  const x=data.schedule.find(x=>x.id===id);
  if(!x) return;

  modal={
    type:"scheduleEdit",
    item:x
  };

  render();
}

/* =========================================================
   IMPORT / EXPORT
========================================================= */

function exportData() {
  const blob=new Blob(
    [JSON.stringify(data,null,2)],
    {type:"application/json"}
  );

  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`klassenboard-backup-${todayISO()}.json`;
  a.click();

  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

function openImport() {
  modal={type:"import"};
  render();
}

function importModal() {
  return `
    ${modalHeader("Backup importieren","Wähle eine zuvor exportierte JSON-Datei.")}

    <input
      class="input"
      type="file"
      accept=".json,application/json"
      onchange="importFile(event)"
    >

    <div class="text-xs text-gray-500 mt-4">
      Beim Import werden die aktuellen Daten ersetzt.
    </div>
  `;
}

const oldModalContent = modalContent;

modalContent = function() {
  if(modal?.type==="settings") return settingsModal();
  if(modal?.type==="import") return importModal();
  if(modal?.type==="scheduleEdit") return editScheduleModal(modal.item);
  return oldModalContent();
};

function importFile(e) {
  const file=e.target.files[0];
  if(!file) return;

  const reader=new FileReader();

  reader.onload=()=>{
    try {
      const imported=JSON.parse(reader.result);

      if(!imported.settings || !imported.subjects) {
        throw new Error("Ungültiges KlassenBoard-Backup");
      }

      data={
        ...structuredClone(defaultData),
        ...imported,
        settings:{
          ...defaultData.settings,
          ...(imported.settings||{})
        }
      };

      save();
      modal=null;
      render();

    } catch {
      alert("Die Datei konnte nicht importiert werden.");
    }
  };

  reader.readAsText(file);
}

function resetData() {
  if(!confirm("Wirklich ALLE KlassenBoard-Daten löschen?")) return;

  localStorage.removeItem(STORAGE_KEY);
  data=structuredClone(defaultData);
  modal=null;
  render();
}

/* =========================================================
   EDIT SCHEDULE
========================================================= */

function editScheduleModal(x) {
  return `
    ${modalHeader("Stunde bearbeiten","Ändere deine Unterrichtsstunde.")}

    <form onsubmit="updateSchedule(event,'${x.id}')">
      <div class="grid md:grid-cols-2 gap-4">
        ${field("Wochentag",`
          <select class="input" name="day">
            ${[0,1,2,3,4].map(d=>`
              <option value="${d}" ${Number(x.day)===d?"selected":""}>${dayName(d)}</option>
            `).join("")}
          </select>
        `)}

        ${field("Stunde",`
          <input class="input" type="number" name="period" value="${x.period}" min="1" max="12">
        `)}

        ${field("Fach",subjectSelect("subject",x.subject))}
        ${field("Raum",`<input class="input" name="room" value="${esc(x.room||"")}">`)}
        ${field("Von",`<input class="input" type="time" name="from" value="${x.from}">`)}
        ${field("Bis",`<input class="input" type="time" name="to" value="${x.to}">`)}
        ${field("Lehrer",`<input class="input" name="teacher" value="${esc(x.teacher||"")}">`)}
      </div>

      ${modalButtons()}
    </form>

    <button class="btn btn-danger w-full mt-2"
      onclick="deleteItem('schedule','${x.id}');modal=null;render()">
      Stunde löschen
    </button>
  `;
}

function updateSchedule(e,id) {
  const f=formData(e);
  const x=data.schedule.find(x=>x.id===id);

  if(!x) return;

  Object.assign(x,{
    day:Number(f.day),
    period:Number(f.period),
    subject:f.subject,
    room:f.room,
    from:f.from,
    to:f.to,
    teacher:f.teacher
  });

  save();
  modal=null;
  render();
}

   MOBILE NAV
========================================================= */

function toggleMobileNav() {
  const el=document.getElementById("mobileNav");

  if(el) {
    el.classList.toggle("hidden");
  }
}

/* =========================================================
   LIVE UPDATE
========================================================= */

setInterval(()=>{
  if(!modal) {
    const status=currentStatus();

    const remaining=document.getElementById("liveRemaining");
    const progress=document.getElementById("liveProgress");

    if(status.type==="lesson" && remaining) {
      remaining.textContent=formatRemaining(status.remaining);

      if(progress) {
        progress.style.width=
          Math.max(0,Math.min(100,(status.elapsed/status.total)*100))+"%";
      }
    }
  }
},1000);

/* =========================================================
   INITIAL
========================================================= */

render();
</script>
